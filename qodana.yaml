#-------------------------------------------------------------------------------#
#               Qodana analysis is configured by qodana.yaml file               #
#             https://www.jetbrains.com/help/qodana/qodana-yaml.html            #
#-------------------------------------------------------------------------------#
version: "1.0"

#Specify inspection profile for code analysis
profile:
  name: qodana.starter

#Enable inspections
#include:
#  - name: <SomeEnabledInspectionId>

#Disable inspections
exclude:
  # KDoc cross-module references are unresolvable by design -- the strict
  # one-way module layering (config <- core <- launcher <- ui) means lower
  # modules legitimately reference upper-module symbols in human-readable
  # docs without being able to import them. We've decided that's a feature,
  # not a typo source worth catching.
  - name: KDocUnresolvedReference
  #
  # Compose state delegated via `var x by remember { mutableStateOf(...) }`
  # consistently trips this rule -- the 2025.2 linter's flow analysis did not
  # connect the property-delegate setter (the `x = ...` line) to the
  # corresponding getter calls in surrounding composables, so every state
  # mutation in an event handler / coroutine / when-branch gets flagged
  # even when the value is obviously read elsewhere in the same file
  # (e.g. `if (!thresholdDone) { thresholdDone = true }`).
  # The previous removal of this exclusion 2026-05-17 was premature -- the
  # 2.2.16 release PR triggered 21 such false positives across 8 Compose
  # files. The rule is genuinely useful for plain Kotlin code, but the
  # signal-to-noise on Compose-heavy modules is wrong. If a per-site
  # @Suppress at every flagged location surfaces in the diff during a
  # refactor, that's the cleaner pattern; this blanket exclusion is the
  # pragmatic floor.
  - name: AssignedValueIsNeverRead
  #
  # Kotlin 2.5's move to name-based destructuring. Every short form `val (a, b)`
  # whose names are not the component properties is reported, which here is a
  # couple of hundred sites (Pair, IndexedValue, Map.Entry, our own data classes)
  # that all destructure in the order their names say. Each was traced to its
  # producer and none is a swap. The compiler's own name mismatch check is off by
  # default, and the language version that turns it on fails this build on every
  # site at once through allWarningsAsErrors, so leaving these out hides nothing.
  - name: DestructingShortFormNameMismatch
  - name: CustomComponentDestructuringMigration
  #
  # Historically also excluded: UnusedAssignment, UnusedSymbol,
  # HasPlatformType. Removed 2026-05-17 -- they were muted because an
  # older Qodana JVM Community release mis-flagged Compose composables
  # and Kotlin DSL builder receivers as "unused". The linter has handled both
  # correctly since 2025.2, so the blanket exclusion would now hide
  # real findings (e.g. it would have caught the `// TODO: NOT USED`
  # regressions in AuthStatus 2026-05-15). If a specific composable still
  # trips one of those inspections, suppress at the call site
  # (`@Suppress("UnusedSymbol")`) rather than file-wide here.

# CI mounts a real JDK 27 at this path (qodana_code_quality.yml passes `-v <jdk>:/root/.jdks/jdk`).
# The build pins a Java 27 Gradle toolchain, and the linter's bundled JBR has no 27 to auto-download,
# so we point the project (and thus Gradle's JVM) at the mounted 27 to resolve toolchain(27) locally.
projectJDK: /root/.jdks/jdk

# Generated sources the analysis reads but the Gradle import does not produce:
# the Compose resource accessors of client-ui and nx-ui (`Res`), client-ui's
# BuildConfig and the widget registry KSP writes. Without them every file that
# names one is analysed around unresolved references, which the report lists as
# sanity problems. A failure here is not allowed to fail the scan: the comment the
# scan posts is what the release workflow's review gate reads.
bootstrap: >-
  JAVA_HOME=/root/.jdks/jdk ./gradlew --no-daemon -q
  :client-ui:prepareKotlinIdeaImport :nx-ui:prepareKotlinIdeaImport
  :client-ui:generateDesktopMainBuildConfigClasses :client-ui:kspKotlinDesktop
  || echo "qodana bootstrap: generated sources not produced, analysing without them"

#Install IDE plugins before Qodana execution (Applied in CI/CD pipeline)
#plugins:
#  - id: <plugin.id> #(plugin id can be found at https://plugins.jetbrains.com)

# Quality gate. Will fail the CI/CD pipeline if any condition is not met
# severityThresholds - configures maximum thresholds for different problem severities
# testCoverageThresholds - configures minimum code coverage on a whole project and newly added code
# Code Coverage is available in Ultimate and Ultimate Plus plans
#failureConditions:
#  severityThresholds:
#    any: 15
#    critical: 5
#  testCoverageThresholds:
#    fresh: 70
#    total: 50
  
#Qodana supports other languages, for example, Python, JavaScript, TypeScript, Go, C#, PHP
#For all supported languages see https://www.jetbrains.com/help/qodana/linters.html
linter: jetbrains/qodana-jvm-community:2026.2
