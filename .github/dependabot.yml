# Dependabot keeps the Gradle version catalog, the docs npm project, and the
# GitHub Actions used by the workflows current. Updates target `dev` (the active
# development branch) -- bumps integrate and get tested there before flowing to
# `stable` via the release process, never landing straight on the release branch.
# Grouped so a week's bumps arrive as a few reviewable PRs instead of a swarm.
version: 2

updates:
  # Gradle: reads gradle/libs.versions.toml plus every module's build.gradle.kts.
  - package-ecosystem: gradle
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      kotlin:
        patterns:
          - "org.jetbrains.kotlin*"
          - "com.google.devtools.ksp*"
      compose:
        patterns:
          - "org.jetbrains.compose*"
      ktor:
        patterns:
          - "io.ktor*"
      koin:
        patterns:
          - "io.insert-koin*"
      test:
        patterns:
          - "org.junit*"
          - "io.mockk*"
    # No ignores. material3 was held on the 1.11 alpha line while compose core
    # was 1.11: the alpha it would have jumped to needed a core that had not
    # shipped. Core is on 1.12 now and the pair moved together, so the hold has
    # nothing left to protect.

  # Docs site (Astro / Starlight) under docs/.
  - package-ecosystem: npm
    directory: /docs
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"

  # Actions referenced by .github/workflows/*.yml.
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
