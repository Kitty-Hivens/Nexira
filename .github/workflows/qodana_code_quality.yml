#-------------------------------------------------------------------------------#
#            Discover all capabilities of Qodana in our documentation           #
#             https://www.jetbrains.com/help/qodana/about-qodana.html           #
#-------------------------------------------------------------------------------#

name: Qodana
on:
  workflow_dispatch:
  pull_request:
  push:
    # Default branch is `stable`; the prior `master` reference was a template
    # default that never fired on this repo because no master branch exists.
    branches:
      - stable

jobs:
  qodana:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      checks: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # The Gradle build pins a Java 26 toolchain, but the Qodana linter's bundled
      # JBR has no 26 and cannot auto-download it, so its Gradle import died on
      # "No defined toolchain download url" for languageVersion=26. Install a real
      # JDK 26 on the runner and mount it into the linter container (the -v below);
      # qodana.yaml's projectJDK points the project's Gradle JVM at it so
      # toolchain(26) resolves to the running JVM instead of a download.
      - name: Set up JDK 26 for the Gradle toolchain
        id: jdk26
        uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: '26'
      - name: 'Qodana Scan'
        uses: JetBrains/qodana-action@v2026.1.3
        env:
          QODANA_TOKEN: ${{ secrets.QODANA_TOKEN }}
        with:
          # In pr-mode: 'true' Qodana checks only changed files
          pr-mode: false
          use-caches: true
          post-pr-comment: true
          use-annotations: true
          # Upload Qodana results (SARIF, other artifacts, logs) as an artifact to the job
          # Enabled so PR reviewers (and the maintainer locally via `gh run download`)
          # can pull the SARIF for line-level findings instead of only seeing the
          # aggregate count from post-pr-comment.
          upload-result: true
          # quick-fixes available in Ultimate and Ultimate Plus plans
          push-fixes: 'none'
          # Mount the runner's JDK 26 into the linter container so projectJDK
          # (/root/.jdks/jdk) resolves the Gradle toolchain. Comma-splits into
          # `qodana scan` args.
          args: -v,${{ steps.jdk26.outputs.path }}:/root/.jdks/jdk
