name: comment-lint

on:
  pull_request:
    branches: [stable, dev]
    paths:
      - "**/*.kt"
      - "**/*.kts"
      - "**/*.java"
      - "scripts/check-comments.py"
      - ".github/workflows/comment-lint.yml"
  push:
    branches: [stable]

permissions:
  contents: read

jobs:
  scan:
    name: Style-D anti-patterns
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # Strict: the scan fails on any banned pattern. The baseline is clean,
      # so this only ever fires on a newly introduced one.
      - name: Scan for Style-D anti-patterns
        run: python3 scripts/check-comments.py --strict
