name: AppImage Portability

# ── Cross-distro AppImage smoke ────────────────────────────────────────────
#
# Nexira is built on ubuntu-latest (Debian-family, recent glibc). Users run
# it on a long tail: Fedora, Arch, openSUSE, Void, downstream Debian forks.
# An AppImage that builds clean on Ubuntu can still fail on those distros
# because of:
#   - glibc version mismatch (we link to whatever Ubuntu LTS ships, older
#     distros may have older glibc that lacks symbols our binary requires)
#   - missing FUSE (AppImage 1.x uses libfuse2; some minimal containers
#     don't ship it — we work around with --appimage-extract-and-run)
#   - musl libc (Alpine, default Void) — fundamentally incompatible with
#     glibc-linked binaries; documented as "won't fix" rather than tested
#
# This workflow takes an AppImage -- the just-built artifact when called as a
# release gate, or the latest released asset on a manual run -- extracts it,
# and verifies the launcher gets past its init phase on each distro by
# grepping captured stdout for the `Display: toolkit=...` log line that
# Main.kt emits after toolkit init.
#
# That marker means: JVM ran, logback initialised, PlatformPaths resolved,
# AWT toolkit chosen. Anything failing AFTER that (Compose window create,
# Skiko paint, etc.) is a "no display" problem in the container, not a
# distro-portability problem with our AppImage.
#
# Triggers:
#   - workflow_call      — gate the release pipeline: build_release.yml calls
#                          this against the just-built AppImage artifact, so a
#                          distro regression blocks publish instead of shipping
#   - workflow_dispatch  — run any time, ad hoc, against the latest release

on:
  workflow_call:
    inputs:
      artifact_name:
        description: >-
          Build artifact in the calling run holding the AppImage to test. When
          set, the AppImage is pulled from that artifact via `gh run download`
          instead of the latest release -- this is how build_release.yml gates
          a publish. Empty (the workflow_dispatch case) uses the released asset.
        type: string
        required: false
        default: ""
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  portability:
    name: ${{ matrix.distro_name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # `expect_keyring`:
        #   any  -- factory may pick the native backend or fall back to NoOp.
        #           In container hosts without a running DBus session, the
        #           libsecret probe fails internally and the launcher falls
        #           back via isAvailable()=false; that's NoOp anyway in
        #           practice, but the assertion stays loose because we don't
        #           want false positives if a future CI image adds DBus.
        #   noop -- factory MUST select NoOp (libsecret absent from the
        #           image at all; LinuxLibsecretKeyringStorage construction
        #           throws on SymbolLookup, runCatching swallows, NoOp wins).
        #           Catches a regression where the construction-time crash
        #           is no longer caught by the factory.
        include:
          # X11 client libs (libXi / libXrender / libXtst / libXext /
          # libXcursor / libXxf86vm) + xauth: see the same block in
          # pr-portability.yml for the long rationale. Short version:
          # `libawt_xawt.so` inside jlink's bundled JRE links to system
          # X libs at runtime, minimal distro containers don't pull
          # them in by default but real desktop installs do.
          - distro_name: Fedora-latest
            container: registry.fedoraproject.org/fedora:latest
            expect_keyring: any
            install_cmd: |
              dnf install -y --setopt=install_weak_deps=False \
                xorg-x11-server-Xvfb fuse-libs which findutils \
                libsecret gh \
                libXi libXrender libXtst libXext libXcursor libXxf86vm \
                fontconfig freetype mesa-libGL \
                xorg-x11-xauth
          - distro_name: Arch-latest
            container: archlinux:latest
            expect_keyring: any
            # pacman -Syu (not -Sy): partial-upgrade trap -- newly-installed
            # packages link against latest repo libs (xorg-server-xvfb vs.
            # libnettle.so.9 most recently) while stale system libs in the
            # container go unrefreshed, breaking Xvfb at runtime. -Syu is
            # the canonical Arch container pattern.
            # xorg-xkbcomp: Xvfb shells out to `xkbcomp` at startup to compile
            # the keymap; xkeyboard-config provides only the keymap source.
            # On Arch the binary is a separate package.
            install_cmd: |
              pacman -Syu --noconfirm \
                xorg-server-xvfb fuse2 which libsecret github-cli \
                libxi libxrender libxtst libxext libxcursor libxxf86vm \
                fontconfig freetype2 libglvnd \
                xorg-xauth xkeyboard-config xorg-xkbcomp
          - distro_name: Debian-stable
            container: debian:stable
            expect_keyring: any
            # ca-certificates is explicit because --no-install-recommends
            # drops it from gh's dependency closure; the debian:stable image
            # no longer ships a pre-installed CA bundle, so `gh release
            # download` failed TLS verification against api.github.com.
            install_cmd: |
              apt-get update -qq
              apt-get install -y --no-install-recommends \
                ca-certificates xvfb libfuse2 libsecret-1-0 gh \
                libxi6 libxrender1 libxtst6 libxext6 libxcursor1 libxxf86vm1 \
                libfontconfig1 libfreetype6 libgl1 \
                xauth
          - distro_name: Fedora-no-libsecret
            container: registry.fedoraproject.org/fedora:latest
            expect_keyring: noop
            # Deliberately no libsecret -- exercises the keyring factory's
            # construction-time-exception fallback path (LinuxLibsecret
            # SymbolLookup throws on the missing .so, runCatching swallows,
            # NoOp wins). A real-world minimal Fedora install ships no
            # libsecret either, so this also covers "user on a freshly
            # bootstrapped distro" not just "test scaffold quirk".
            install_cmd: |
              dnf install -y --setopt=install_weak_deps=False \
                xorg-x11-server-Xvfb fuse-libs which findutils gh \
                libXi libXrender libXtst libXext libXcursor libXxf86vm \
                fontconfig freetype mesa-libGL \
                xorg-x11-xauth
    container: ${{ matrix.container }}
    steps:
      - name: Install runtime deps for ${{ matrix.distro_name }}
        run: ${{ matrix.install_cmd }}

      - name: Get the AppImage (build artifact when gating, else latest release)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/nexira
          if [ -n "${{ inputs.artifact_name }}" ]; then
            # Gate mode: the AppImage just built in the calling run, before the
            # release is cut. Same run id, so the artifact is in reach.
            gh run download "${{ github.run_id }}" \
              --repo "${{ github.repository }}" \
              --name "${{ inputs.artifact_name }}" \
              --dir /tmp/nexira
          else
            gh release download --repo "${{ github.repository }}" \
              --pattern "*x86_64.AppImage" \
              --dir /tmp/nexira
          fi
          chmod +x /tmp/nexira/*.AppImage
          echo "Got:"
          ls -la /tmp/nexira/

      - name: Extract AppImage (skip FUSE — not always available in containers)
        working-directory: /tmp
        run: ./nexira/*.AppImage --appimage-extract > /dev/null

      - name: Launch with virtual display, capture init log
        working-directory: /tmp
        env:
          NEXIRA_DATA_DIR: /tmp/nexira-data
        run: |
          # 8s wall budget: launcher gets to splash within 3-4s on a fresh
          # container, logging the Display line on the way. Killed via
          # `timeout` after that — exit code 124 means we hit the deadline,
          # which is the expected signal (launcher was alive and rendering).
          # Anything else means it crashed before we reached deadline.
          set +e
          timeout --kill-after=2s 8s xvfb-run -a \
            squashfs-root/AppRun > /tmp/nexira.stdout 2>&1
          EXIT=$?
          set -e

          echo "── Launcher exit code: $EXIT (124 = timeout hit, expected; 0 = clean exit, unusual but ok)"
          echo "── stdout tail:"
          tail -30 /tmp/nexira.stdout || true

          if [[ "$EXIT" != "124" && "$EXIT" != "0" ]]; then
            echo "::error title=Portability::Launcher crashed before timeout (exit $EXIT) on ${{ matrix.distro_name }}"
            exit 1
          fi

      - name: Verify init phase reached
        run: |
          # The Display line from Main.kt is the canonical "init done" marker.
          # If it's NOT in stdout, JVM died before logback's CONSOLE appender
          # got to flush — meaning the AppImage's bundled JRE failed to load
          # or PlatformPaths blew up before any logger was created.
          if grep -q "Display: toolkit=" /tmp/nexira.stdout; then
            echo "::notice title=Portability::${{ matrix.distro_name }} reached toolkit-detection — distro is supported"
          else
            echo "::error title=Portability::No 'Display: toolkit=' line on ${{ matrix.distro_name }}. JRE / native lib / PlatformPaths failed before logging init."
            echo "── full stdout:"
            cat /tmp/nexira.stdout || true
            exit 1
          fi

      - name: Verify launcher.log was written and clean
        env:
          NEXIRA_DATA_DIR: /tmp/nexira-data
        run: |
          # Until now the test asserted only the stdout marker. stdout buffering
          # under xvfb-run + container terminations can make stdout assertions
          # flaky; the disk-side launcher.log written by Pulse is the durable
          # source of truth. Verify:
          #   1. The log exists where PlatformPaths would put it (under
          #      $NEXIRA_DATA_DIR/logs/, since the env var overrides every
          #      per-OS default). Missing -> logback never initialised ->
          #      Pulse pipeline broken or path resolution failed.
          #   2. The log is non-trivial in size. Empty file = appender opened
          #      but never flushed before JVM died.
          #   3. The log contains no FATAL / NoClassDefFoundError /
          #      UnsatisfiedLinkError lines. Those are init-time class-load
          #      failures that previously only surfaced through stdout greps.
          LOG="$NEXIRA_DATA_DIR/logs/launcher.log"
          if [ ! -f "$LOG" ]; then
            echo "::error title=Portability::launcher.log not found at $LOG -- Pulse logback init failed on ${{ matrix.distro_name }}"
            ls -la "$NEXIRA_DATA_DIR/" 2>/dev/null || true
            exit 1
          fi
          LOG_SIZE=$(stat -c%s "$LOG" 2>/dev/null || echo 0)
          if [ "$LOG_SIZE" -lt 100 ]; then
            echo "::error title=Portability::launcher.log too small ($LOG_SIZE bytes) on ${{ matrix.distro_name }} -- logback opened the appender but never flushed"
            cat "$LOG" || true
            exit 1
          fi
          if grep -qE 'FATAL|NoClassDefFoundError|UnsatisfiedLinkError|java\.lang\.LinkageError' "$LOG"; then
            echo "::error title=Portability::Init-time class-load failures in launcher.log on ${{ matrix.distro_name }}:"
            grep -nE 'FATAL|NoClassDefFoundError|UnsatisfiedLinkError|java\.lang\.LinkageError' "$LOG" | head -20
            exit 1
          fi
          echo "::notice title=Portability::launcher.log on ${{ matrix.distro_name }}: $LOG_SIZE bytes, no FATAL/Linkage/NoClassDef lines"

      - name: Verify keyring fallback (no-libsecret matrix entry only)
        if: matrix.expect_keyring == 'noop'
        env:
          NEXIRA_DATA_DIR: /tmp/nexira-data
        run: |
          # The secret store now opens lazily via libvault (LazySecretVault) on first
          # use, not at boot, so a no-libsecret host no longer eagerly selects and logs
          # "Keyring storage: NoOp" during the boot smoke -- tier choice is deferred to
          # the first vault access (login), and the old KeyringStorageFactory only runs
          # on a pre-v5 credentials migration. What still matters: a no-libsecret host
          # must degrade lazily, not crash at boot on a keyring / libsecret symbol
          # lookup. (Graceful boot is also asserted by the init + launch steps above.)
          LOG="$NEXIRA_DATA_DIR/logs/launcher.log"
          if grep -qiE 'libsecret.*(fail|error|throw|exception)|SymbolLookup|Secret Service.*(fail|error)' "$LOG"; then
            echo "::error title=Portability::Keyring/libsecret failure at boot on ${{ matrix.distro_name }} (secret store should degrade lazily, not crash):"
            grep -inE 'libsecret|SymbolLookup|Secret Service|keyring|vault' "$LOG" | head -20
            exit 1
          fi
          echo "::notice title=Portability::no-libsecret boot healthy; secret store degrades lazily via libvault (tier selected on first use, not at boot)"

      - name: Upload stdout and log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: portability-stdout-${{ matrix.distro_name }}
          path: |
            /tmp/nexira.stdout
            /tmp/nexira-data/logs/
          retention-days: 7
