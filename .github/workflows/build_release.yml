name: Build and Publish

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-all:
    name: Build on ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: windows-latest
            format: msi
            artifact_name: windows-files
          - os: ubuntu-latest
            format: deb rpm appimage
            artifact_name: linux-files
          - os: macos-latest
            format: dmg
            artifact_name: macos-file
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # 1. Установка JetBrains Runtime 25 (Wakefield Support)
      - name: Setup JetBrains Runtime
        uses: actions/setup-java@v4
        with:
            distribution: 'jetbrains'
            java-version: '25.0.1+268.49'
            java-package: 'jdk'

      - uses: gradle/actions/setup-gradle@v3

      - name: Install Linux Deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libgl1-mesa-dri xorg-dev rpm binutils libfuse2 file

      # 2. Сборка с агрессивными оптимизациями
      - name: Package Application
        shell: bash
        run: |
          ./gradlew clean :client-ui:packageDistribution \
          $(echo "${{ matrix.format }}" | sed 's/\([^ ]*\)/:client-ui:package\u\1/g') \
          -Pversion=${{ github.ref_name }} \
          -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

      # 3. Подготовка артефактов (Windows)
      - name: Prepare Windows Artifacts
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Get-ChildItem client-ui/build/compose/binaries/main/msi/*.msi | Rename-Item -NewName "AuraLauncher-Setup.msi"
          Move-Item client-ui/build/compose/binaries/main/msi/AuraLauncher-Setup.msi .
          Compress-Archive -Path client-ui/build/compose/binaries/main/app/* -DestinationPath AuraLauncher-Win-Portable.zip

      # 4. Сборка AppImage (Linux)
      - name: Build AppImage
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          find client-ui/build/compose/binaries -name "*.deb" -exec mv {} AuraLauncher.deb \;
          find client-ui/build/compose/binaries -name "*.rpm" -exec mv {} AuraLauncher.rpm \;

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.msi
            *.zip
            *.AppImage
            *.deb
            *.rpm
            *.dmg
          if-no-files-found: error

  publish-release:
    name: Publish Release
    needs: build-all
    runs-on: ubuntu-latest
    steps:
      - name: Download Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          files: artifacts/*
