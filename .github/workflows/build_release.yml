name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.3.0)'
        required: true
        default: '1.3.0'

# Two simultaneous tag pushes (e.g. accidentally pushing v2.2.9 twice or
# pushing tag + retry) would otherwise race the GitHub release publish
# step. cancel-in-progress=false because we don't want a second tag push
# to *abort* an in-flight release that may already have uploaded artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'jetbrains'

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Tests - must pass BEFORE any build
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Run Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # fail-fast: false — one OS failing shouldn't kill the others; we want
    # to see ALL platform-specific failures in one run, not race-of-the-first.
    # shell: bash so steps work identically on Windows runners (PowerShell's
    # default shell would mangle the gradlew invocation).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests
        run: ./gradlew :client-core:test :client-launcher:test --continue

      - name: Upload test reports
        if: always()   # we publish it even if it falls, so we can see what’s broken
        uses: actions/upload-artifact@v4
        with:
          name: test-reports-${{ matrix.os }}
          path: |
            client-core/build/reports/tests/
            client-launcher/build/reports/tests/

  # ─────────────────────────────────────────────────────────────────────────
  # Extract changelog section for this version from CHANGELOG.md
  # ─────────────────────────────────────────────────────────────────────────
  changelog:
    name: Extract Changelog
    runs-on: ubuntu-latest
    needs: test   # we don’t build if the tests fail
    outputs:
      notes: ${{ steps.extract.outputs.notes }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        id: extract
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "notes=No CHANGELOG.md found — see commit history." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Keep a Changelog format: ## [1.3.0] - 2025-xx-xx
          # Grab everything between the target version header and the next one (or EOF).
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "["ver"]") > 0) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' | sed 's/[[:space:]]*$//')

          if [ -z "$NOTES" ]; then
            NOTES="No changelog entry for v${VERSION}. See [CHANGELOG.md](./CHANGELOG.md)."
          fi

          EOF_DELIM=$(openssl rand -hex 8)
          {
            echo "notes<<$EOF_DELIM"
            echo "$NOTES"
            echo "$EOF_DELIM"
          } >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────
  # WINDOWS — Inno Setup EXE + Portable ZIP
  # ─────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (EXE + ZIP)
    runs-on: windows-latest
    needs: changelog
    env:
      APP_VERSION: ${{ needs.changelog.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build distributable
        shell: bash
        run: ./gradlew :client-ui:createReleaseDistributable -PappVersion="$APP_VERSION"

      - name: Compile Inno Setup EXE
        shell: pwsh
        run: |
          iscc `
            /DAppVersion="$env:APP_VERSION" `
            /F"AuraLauncher-$env:APP_VERSION-Setup" `
            setup.iss

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          $src = "client-ui\build\compose\binaries\main-release\app"
          Compress-Archive -Path "$src\*" `
            -DestinationPath "AuraLauncher-$env:APP_VERSION-Windows-Portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            AuraLauncher-${{ env.APP_VERSION }}-Setup.exe
            AuraLauncher-${{ env.APP_VERSION }}-Windows-Portable.zip

  # ─────────────────────────────────────────────────────────────────────────
  # LINUX — AppImage only
  # ─────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (AppImage)
    runs-on: ubuntu-22.04
    needs: changelog
    env:
      APP_VERSION: ${{ needs.changelog.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # appimagetool is the heaviest single download in the Linux build leg
      # (~30 MB from a `continuous` release tag that doesn't change between
      # most of our builds). Cache hit makes the assembly leg ~20s faster
      # and survives upstream availability blips. Bump the key suffix when
      # you want to force a refresh against a new continuous build.
      - name: Cache appimagetool
        id: cache-appimagetool
        uses: actions/cache@v4
        with:
          path: appimagetool
          key: appimagetool-continuous-x86_64-2026-05

      - name: Install AppImage tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y fuse libfuse2 desktop-file-utils appstream xmlstarlet
          if [ -f appimagetool ]; then
            sudo install -m 0755 appimagetool /usr/local/bin/appimagetool
          else
            wget -qO appimagetool \
              "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
            chmod +x appimagetool
            sudo install -m 0755 appimagetool /usr/local/bin/appimagetool
          fi

      - name: Build JAR
        run: ./gradlew :client-ui:packageReleaseUberJarForCurrentOS -PappVersion="$APP_VERSION"

      - name: Validate desktop entry
        run: desktop-file-validate resources/aura-launcher.desktop

      - name: Validate AppStream metainfo
        run: appstreamcli validate --pedantic resources/io.github.kitty_hivens.auralauncher.metainfo.xml

      - name: Inject release entry into metainfo
        run: ./scripts/inject-metainfo-release.sh "$APP_VERSION"

      - name: Build AppImage
        run: |
          JAR=$(ls client-ui/build/compose/jars/*-release*.jar | head -1)
          ./scripts/build-appimage.sh "$APP_VERSION" "$JAR"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: AuraLauncher-${{ env.APP_VERSION }}-x86_64.AppImage

  # ─────────────────────────────────────────────────────────────────────────
  # MACOS — DMG
  # ─────────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (DMG)
    runs-on: macos-latest
    needs: changelog
    env:
      APP_VERSION: ${{ needs.changelog.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build DMG
        run: ./gradlew :client-ui:packageReleaseDmg -PappVersion="$APP_VERSION"

      - name: Rename DMG
        run: |
          mv client-ui/build/compose/binaries/main-release/dmg/*.dmg \
             "AuraLauncher-$APP_VERSION.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: AuraLauncher-${{ env.APP_VERSION }}.dmg

  # ─────────────────────────────────────────────────────────────────────────
  # RELEASE — collect artifacts, publish with proper changelog body
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [changelog, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.changelog.outputs.version }}
    steps:
      # Need the repo source for scripts/compose-release-body.sh that the
      # "Compose release body" step calls below. Without checkout it errors
      # with `./scripts/compose-release-body.sh: No such file or directory`
      # (regression introduced by CI-modernize #6 on PR #128 when the
      # release-body composition was extracted out of inline yaml).
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: '*-artifacts'
          merge-multiple: true
          path: dist/

      - name: Generate SHA256 checksums
        working-directory: dist
        run: find . -maxdepth 1 -type f -exec sha256sum {} + > SHA256SUMS.txt

      - name: Generate release-manifest.json
        working-directory: dist
        env:
          CHANGELOG_NOTES: ${{ needs.changelog.outputs.notes }}
        run: |
          # Highlights = lines under "### Highlights" up to the next "### "
          HIGHLIGHTS=$(printf '%s' "$CHANGELOG_NOTES" \
            | awk '/^### Highlights/ {flag=1; next} /^### / {flag=0} flag' \
            | sed '/^[[:space:]]*$/d')

          ASSETS_JSON='[]'
          while IFS= read -r line; do
            hash=$(echo "$line" | awk '{print $1}')
            file=$(echo "$line" | awk '{print $2}' | sed 's|^\./||')
            [ -z "$file" ] && continue
            case "$file" in
              SHA256SUMS.txt|release-manifest.json) continue ;;
            esac

            case "$file" in
              *Setup.exe)             plat=windows; kind=installer ;;
              *Windows-Portable.zip)  plat=windows; kind=portable  ;;
              *.AppImage)             plat=linux;   kind=appimage  ;;
              *.dmg)                  plat=macos;   kind=dmg       ;;
              *)                      plat=unknown; kind=unknown   ;;
            esac

            size=$(stat -c%s "$file")
            ASSETS_JSON=$(echo "$ASSETS_JSON" \
              | jq --arg n "$file" --arg p "$plat" --arg k "$kind" \
                   --arg s "$hash" --argjson sz "$size" \
                   '. + [{"name": $n, "platform": $p, "kind": $k, "sha256": $s, "size": $sz}]')
          done < SHA256SUMS.txt

          PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg ver "$APP_VERSION" \
            --arg pub "$PUBLISHED_AT" \
            --arg hl "$HIGHLIGHTS" \
            --argjson assets "$ASSETS_JSON" \
            '{
              schemaVersion: 1,
              version: $ver,
              publishedAt: $pub,
              highlights: (if $hl == "" then null else $hl end),
              assets: $assets
            }' > release-manifest.json

      - name: Compose release body
        id: body
        env:
          CHANGELOG_NOTES: ${{ needs.changelog.outputs.notes }}
        run: |
          EOF_DELIM=$(openssl rand -hex 8)
          {
            echo "body<<$EOF_DELIM"
            ./scripts/compose-release-body.sh
            echo "$EOF_DELIM"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: Aura Launcher v${{ env.APP_VERSION }}
          body: ${{ steps.body.outputs.body }}
          files: dist/*
          draft: false
          generate_release_notes: false
          prerelease: ${{ contains(needs.changelog.outputs.version, '-') }}
