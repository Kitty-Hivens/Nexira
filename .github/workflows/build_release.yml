name: Build and Publish (Win Fix + JBR 25)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-all:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            # Для Windows берем ZIP (важно для setup-java)
            jbr_url: "https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-25.0.1-windows-x64-b268.49.zip"
            # На Windows tasks разделяем пробелом, gradle сам поймет
            tasks: "packageMsi packageDistribution"
            artifact_name: windows-files
          - os: ubuntu-latest
            jbr_url: "https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-25.0.1-linux-x64-b268.49.tar.gz"
            tasks: "packageDeb packageRpm packageAppImage"
            artifact_name: linux-files
          - os: macos-latest
            # Для Mac M1 (GitHub M1 runners)
            jbr_url: "https://cache-redirector.jetbrains.com/intellij-jbr/jbrsdk-25.0.1-osx-aarch64-b268.49.tar.gz"
            tasks: "packageDmg"
            artifact_name: macos-file
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # 1. Просто скачиваем файл. Никакой распаковки руками.
      - name: Download JBR 25
        shell: bash
        run: |
          echo "Downloading from ${{ matrix.jbr_url }}"
          curl -L "${{ matrix.jbr_url }}" -o java_dist.archive

      # 2. Магия: скармливаем архив экшену. Он сам распакует и настроит пути.
      - name: Install JBR from File
        uses: actions/setup-java@v4
        with:
          distribution: 'jdkfile'
          jdkFile: java_dist.archive
          java-version: '25'
          architecture: ${{ matrix.os == 'macos-latest' && 'aarch64' || 'x64' }}

      - name: Verify Java
        run: java -version

      - uses: gradle/actions/setup-gradle@v3

      - name: Install Linux Build Tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libgl1-mesa-dri xorg-dev rpm binutils libfuse2 file

      - name: Package Application
        shell: bash
        run: |
          chmod +x gradlew
          # Запускаем сборку
          ./gradlew clean :client-ui:packageDistribution \
          $(echo "${{ matrix.tasks }}" | sed 's/\([^ ]*\)/:client-ui:\1/g') \
          -Pversion=${{ github.ref_name }} \
          -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

      - name: Collect Artifacts
        shell: bash
        run: |
          # Собираем всё в кучу
          find client-ui/build/compose/binaries -name "*.msi" -exec cp {} AuraLauncher-Setup.msi \; 2>/dev/null || true
          find client-ui/build/compose/binaries -name "*.deb" -exec cp {} AuraLauncher.deb \; 2>/dev/null || true
          find client-ui/build/compose/binaries -name "*.rpm" -exec cp {} AuraLauncher.rpm \; 2>/dev/null || true
          find client-ui/build/compose/binaries -name "*.dmg" -exec cp {} AuraLauncher.dmg \; 2>/dev/null || true
          find client-ui/build/compose/binaries -name "*.AppImage" -exec cp {} AuraLauncher.AppImage \; 2>/dev/null || true
          
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            powershell "Compress-Archive -Path client-ui/build/compose/binaries/main/app/* -DestinationPath AuraLauncher-Win-Portable.zip"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.msi
            *.zip
            *.AppImage
            *.deb
            *.rpm
            *.dmg
          if-no-files-found: warn

  publish-release:
    name: Create Release
    needs: build-all
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          files: artifacts/*
