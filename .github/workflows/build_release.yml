name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.3.0)'
        required: true
        default: '1.3.0'

env:
  JAVA_VERSION: '25'
  JAVA_DISTRIBUTION: 'jetbrains'

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Tests - must pass BEFORE any build
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run unit tests
        run: ./gradlew :client-core:test :client-launcher:test --continue

      - name: Upload test reports
        if: always()   # we publish it even if it falls, so we can see what’s broken
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            client-core/build/reports/tests/
            client-launcher/build/reports/tests/

  # ─────────────────────────────────────────────────────────────────────────
  # Extract changelog section for this version from CHANGELOG.md
  # ─────────────────────────────────────────────────────────────────────────
  changelog:
    name: Extract Changelog
    runs-on: ubuntu-latest
    needs: test   # we don’t build if the tests fail
    outputs:
      notes: ${{ steps.extract.outputs.notes }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        id: extract
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "notes=No CHANGELOG.md found — see commit history." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Keep a Changelog format: ## [1.3.0] - 2025-xx-xx
          # Grab everything between the target version header and the next one (or EOF).
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "["ver"]") > 0) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' | sed 's/[[:space:]]*$//')

          if [ -z "$NOTES" ]; then
            NOTES="No changelog entry for v${VERSION}. See [CHANGELOG.md](./CHANGELOG.md)."
          fi

          EOF_DELIM=$(openssl rand -hex 8)
          {
            echo "notes<<$EOF_DELIM"
            echo "$NOTES"
            echo "$EOF_DELIM"
          } >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────
  # WINDOWS — Inno Setup EXE + Portable ZIP
  # ─────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (EXE + ZIP)
    runs-on: windows-latest
    needs: changelog
    env:
      APP_VERSION: ${{ needs.changelog.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build distributable
        shell: bash
        run: ./gradlew :client-ui:createReleaseDistributable -Pversion="$APP_VERSION"

      - name: Compile Inno Setup EXE
        shell: pwsh
        run: |
          iscc `
            /DAppVersion="$env:APP_VERSION" `
            /F"AuraLauncher-$env:APP_VERSION-Setup" `
            setup.iss

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          $src = "client-ui\build\compose\binaries\main-release\app"
          Compress-Archive -Path "$src\*" `
            -DestinationPath "AuraLauncher-$env:APP_VERSION-Windows-Portable.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            AuraLauncher-${{ env.APP_VERSION }}-Setup.exe
            AuraLauncher-${{ env.APP_VERSION }}-Windows-Portable.zip

  # ─────────────────────────────────────────────────────────────────────────
  # LINUX — AppImage only
  # ─────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (AppImage)
    runs-on: ubuntu-22.04
    needs: changelog
    env:
      APP_VERSION: ${{ needs.changelog.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install AppImage tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y fuse libfuse2 desktop-file-utils appstream
          wget -qO /usr/local/bin/appimagetool \
            "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
          chmod +x /usr/local/bin/appimagetool

      - name: Build JAR
        run: ./gradlew :client-ui:packageReleaseUberJarForCurrentOS -Pversion="$APP_VERSION"

      - name: Validate desktop entry
        run: desktop-file-validate resources/aura-launcher.desktop

      - name: Validate AppStream metainfo
        run: appstreamcli validate --pedantic resources/io.github.kitty_hivens.auralauncher.metainfo.xml

      - name: Inject release entry into metainfo
        run: |
          DATE=$(date -u +%Y-%m-%d)
          sed -i \
            "s|    <releases>|    <releases>\n    <release version=\"$APP_VERSION\" date=\"$DATE\">\n      <url type=\"details\">https://github.com/Kitty-Hivens/Aura-Launcher/releases/tag/v$APP_VERSION</url>\n    </release>|" \
            resources/io.github.kitty_hivens.auralauncher.metainfo.xml

      - name: Assemble AppDir
        run: |
          APPDIR="AppDir"
          JAR=$(ls client-ui/build/compose/jars/*-release*.jar | head -1)
          
          # 1. Build the minimal JRE first — jlink refuses to write into an existing dir
          jlink \
            --output "$APPDIR/usr" \
            --add-modules java.base,java.desktop,java.logging,java.management,java.naming,java.net.http,java.prefs,java.sql,jdk.crypto.ec,jdk.unsupported,jdk.zipfs \
            --no-header-files \
            --no-man-pages \
            --strip-debug \
            --compress=2

          # 2. Create remaining subdirs (usr/bin already exists from jlink)
          mkdir -p \
            "$APPDIR/usr/lib" \
            "$APPDIR/usr/share/applications" \
            "$APPDIR/usr/share/icons/hicolor/256x256/apps" \
            "$APPDIR/usr/share/icons/hicolor/512x512/apps" \
            "$APPDIR/usr/share/metainfo"

          # 3. AppRun entry-point
          cat > "$APPDIR/AppRun" << 'EOF'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/java" \
               -jar "$HERE/usr/lib/aura-launcher.jar" \
               "$@"
          EOF
          chmod +x "$APPDIR/AppRun"

          # 4. Copy assets
          cp "$JAR" "$APPDIR/usr/lib/aura-launcher.jar"
          cp resources/aura-launcher.desktop "$APPDIR/usr/share/applications/"
          cp resources/aura-launcher.desktop "$APPDIR/"
          cp resources/icons/256x256.png "$APPDIR/usr/share/icons/hicolor/256x256/apps/aura-launcher.png"
          cp resources/icons/512x512.png "$APPDIR/usr/share/icons/hicolor/512x512/apps/aura-launcher.png"
          cp resources/icons/256x256.png "$APPDIR/aura-launcher.png"
          # Provide both names so appimagetool finds AppStream metadata
          cp resources/io.github.kitty_hivens.auralauncher.metainfo.xml "$APPDIR/usr/share/metainfo/io.github.kitty_hivens.auralauncher.metainfo.xml"
          cp resources/io.github.kitty_hivens.auralauncher.metainfo.xml "$APPDIR/usr/share/metainfo/io.github.kitty_hivens.auralauncher.appdata.xml"

      - name: Build AppImage
        run: |
          ARCH=x86_64 appimagetool \
            AppDir \
            "AuraLauncher-$APP_VERSION-x86_64.AppImage"

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: AuraLauncher-${{ env.APP_VERSION }}-x86_64.AppImage

  # ─────────────────────────────────────────────────────────────────────────
  # MACOS — DMG
  # ─────────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (DMG)
    runs-on: macos-latest
    needs: changelog
    env:
      APP_VERSION: ${{ needs.changelog.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build DMG
        run: ./gradlew :client-ui:packageReleaseDmg -Pversion="$APP_VERSION"

      - name: Rename DMG
        run: |
          mv client-ui/build/compose/binaries/main-release/dmg/*.dmg \
             "AuraLauncher-$APP_VERSION.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: AuraLauncher-${{ env.APP_VERSION }}.dmg

  # ─────────────────────────────────────────────────────────────────────────
  # RELEASE — collect artifacts, publish with proper changelog body
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [changelog, build-windows, build-linux, build-macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.changelog.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*-artifacts'
          merge-multiple: true
          path: dist/

      - name: Generate SHA256 checksums
        working-directory: dist
        run: find . -maxdepth 1 -type f -exec sha256sum {} + > SHA256SUMS.txt

      - name: Generate release-manifest.json
        working-directory: dist
        env:
          CHANGELOG_NOTES: ${{ needs.changelog.outputs.notes }}
        run: |
          # Highlights = lines under "### Highlights" up to the next "### "
          HIGHLIGHTS=$(printf '%s' "$CHANGELOG_NOTES" \
            | awk '/^### Highlights/ {flag=1; next} /^### / {flag=0} flag' \
            | sed '/^[[:space:]]*$/d')

          ASSETS_JSON='[]'
          while IFS= read -r line; do
            hash=$(echo "$line" | awk '{print $1}')
            file=$(echo "$line" | awk '{print $2}' | sed 's|^\./||')
            [ -z "$file" ] && continue
            case "$file" in
              SHA256SUMS.txt|release-manifest.json) continue ;;
            esac

            case "$file" in
              *Setup.exe)             plat=windows; kind=installer ;;
              *Windows-Portable.zip)  plat=windows; kind=portable  ;;
              *.AppImage)             plat=linux;   kind=appimage  ;;
              *.dmg)                  plat=macos;   kind=dmg       ;;
              *)                      plat=unknown; kind=unknown   ;;
            esac

            size=$(stat -c%s "$file")
            ASSETS_JSON=$(echo "$ASSETS_JSON" \
              | jq --arg n "$file" --arg p "$plat" --arg k "$kind" \
                   --arg s "$hash" --argjson sz "$size" \
                   '. + [{"name": $n, "platform": $p, "kind": $k, "sha256": $s, "size": $sz}]')
          done < SHA256SUMS.txt

          PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg ver "$APP_VERSION" \
            --arg pub "$PUBLISHED_AT" \
            --arg hl "$HIGHLIGHTS" \
            --argjson assets "$ASSETS_JSON" \
            '{
              schemaVersion: 1,
              version: $ver,
              publishedAt: $pub,
              highlights: (if $hl == "" then null else $hl end),
              assets: $assets
            }' > release-manifest.json

      - name: Compose release body
        id: body
        env:
          CHANGELOG_NOTES: ${{ needs.changelog.outputs.notes }}
        run: |
          REPO_BASE="https://github.com/Kitty-Hivens/Aura-Launcher/releases/download/v${APP_VERSION}"

          # Highlights extracted the same way as for the manifest
          HIGHLIGHTS=$(printf '%s' "$CHANGELOG_NOTES" \
            | awk '/^### Highlights/ {flag=1; next} /^### / {flag=0} flag' \
            | sed '/^[[:space:]]*$/d')

          CHECKSUMS=""
          while IFS= read -r line; do
            hash=$(echo "$line" | awk '{print $1}')
            file=$(echo "$line" | awk '{print $2}' | sed 's|^\./||')
            [ -z "$file" ] && continue
            CHECKSUMS="${CHECKSUMS}| \`${file}\` | \`${hash}\` |\n"
          done < dist/SHA256SUMS.txt

          EOF_DELIM=$(openssl rand -hex 8)
          {
            echo "body<<$EOF_DELIM"

            printf '> [!NOTE]\n'
            printf '> **Aura Launcher** is an unofficial third-party launcher and is not affiliated with or endorsed by the original game developers.\n\n'

            if [ -n "$HIGHLIGHTS" ]; then
              printf "## What's New\n\n"
              printf '%s\n\n' "$HIGHLIGHTS"
            fi

            printf '## Downloads\n\n'
            printf '| Platform | File |\n|---|---|\n'
            printf '| Windows Installer | [`AuraLauncher-%s-Setup.exe`](%s/AuraLauncher-%s-Setup.exe) |\n' "$APP_VERSION" "$REPO_BASE" "$APP_VERSION"
            printf '| Windows Portable  | [`AuraLauncher-%s-Windows-Portable.zip`](%s/AuraLauncher-%s-Windows-Portable.zip) |\n' "$APP_VERSION" "$REPO_BASE" "$APP_VERSION"
            printf '| Linux AppImage    | [`AuraLauncher-%s-x86_64.AppImage`](%s/AuraLauncher-%s-x86_64.AppImage) |\n' "$APP_VERSION" "$REPO_BASE" "$APP_VERSION"
            printf '| macOS             | [`AuraLauncher-%s.dmg`](%s/AuraLauncher-%s.dmg) |\n\n' "$APP_VERSION" "$REPO_BASE" "$APP_VERSION"

            printf '<details>\n<summary>SHA256 Checksums</summary>\n\n'
            printf '| File | SHA256 |\n|---|---|\n'
            echo -e "$CHECKSUMS"
            printf '\n</details>\n\n'

            printf "## What's Changed\n\n"
            printf '%s\n' "$CHANGELOG_NOTES"

            echo "$EOF_DELIM"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: Aura Launcher v${{ env.APP_VERSION }}
          body: ${{ steps.body.outputs.body }}
          files: dist/*
          draft: false
          generate_release_notes: false
          prerelease: ${{ contains(needs.changelog.outputs.version, '-') }}
