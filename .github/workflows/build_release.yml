name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version (e.g. 1.3.0)'
        required: true
        default: '1.3.0'

# Two simultaneous tag pushes (e.g. accidentally pushing v2.2.9 twice or
# pushing tag + retry) would otherwise race the GitHub release publish
# step. cancel-in-progress=false because we don't want a second tag push
# to *abort* an in-flight release that may already have uploaded artifacts.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  JAVA_VERSION: '26'
  JAVA_DISTRIBUTION: 'liberica'
  # Every setup-java step below uses `cache: 'gradle'` -- reuses
  # ~/.gradle/caches + ~/.gradle/wrapper across runs (keyed on *.gradle*,
  # gradle-wrapper.properties, gradle/libs.versions.toml). Saves 30-90s
  # per OS per job depending on cache freshness; particularly noticeable
  # on Windows runners where the Gradle distribution download is slow.

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Review gate — refuses to release HEAD that no reviewer engaged with
  #
  # Resolves the PR that brought HEAD onto stable
  # (`gh pr list --search sha:$GITHUB_SHA`) and asserts at least one of:
  #
  #   - Strong: APPROVED review by a non-author. Only humans can leave this;
  #     PR authors cannot self-approve per GitHub policy.
  #   - Weak (Codex): non-author review *of any state*. Codex only ever
  #     leaves COMMENTED reviews ("If Codex has suggestions, it will
  #     comment; otherwise it will react with 👍" — Codex docs). The
  #     presence of a Codex review entry proves the bot processed the diff.
  #   - Weak (Qodana): a `github-actions` comment whose body starts with
  #     `# Qodana`. Qodana posts findings via the comment API, NOT the
  #     review API, so it never shows in `.reviews[]`. We detect it by
  #     bot-author + body marker. Qodana is configured `on: pull_request`
  #     with `post-pr-comment: true`, so this engagement signal is
  #     independent of Codex availability.
  #
  # Failure modes this catches:
  #   1. Direct/force push to stable bypassing PR (no merging PR for SHA).
  #   2. PR merged but BOTH Codex AND Qodana failed to engage — both rate-
  #      limited or both bots disabled. See [[release_protection_model]]
  #      memory for the why-not-tighter explanation.
  #   3. Compromised maintainer account opens a PR + self-merges without
  #      bots wired up. Branch protection on stable handles the merge
  #      attempt; this gate handles any release that squeezed through.
  #
  # Trust model honesty: this is two independent bot-signals, neither of
  # which inspects code semantics rigorously. Two bots saying "ok" still
  # is not "a competent human reviewed the diff". Strengthening requires
  # a non-bot APPROVED review.
  #
  # `GH_TOKEN: secrets.GITHUB_TOKEN` has the `pull_requests: read` scope by
  # default. No extra setup needed.
  # ─────────────────────────────────────────────────────────────────────────
  review-gate:
    name: Review Gate
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      contents: read
    steps:
      - name: Verify HEAD originates from a reviewed PR
        # Nightlies are unreviewed bleeding-dev builds (tagged off dev HEAD, no
        # PR of their own), so the gate does not apply to them. The exemption is
        # decided inside the script rather than by an `if:` on the step, because
        # the expression language has no substring operator and the tag must be
        # read the same way ReleaseChannel.classify reads it. It stays off the
        # JOB either way: a skipped job is inherited by everything downstream
        # through the implicit success() over the needs chain, so gating the job
        # silently skipped changelog and every build under it -- a green run
        # that shipped nothing. The gate still guards every real release.
        env:
          GH_TOKEN:     ${{ secrets.GITHUB_TOKEN }}
          GH_SHA:       ${{ github.sha }}
          GH_REPO:      ${{ github.repository }}
          GH_REF_NAME:  ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # The prerelease suffix must START with "nightly", matching
          # ReleaseChannel.classify. The former `contains(ref_name, 'nightly')`
          # accepted the substring anywhere, so a tag like v9.9.9-rc1nightly
          # walked past this gate while classify still sorted it as Beta and
          # shipped it to everyone on a pre-release channel.
          SUFFIX="${GH_REF_NAME#*-}"
          if [ "$SUFFIX" != "$GH_REF_NAME" ]; then
            case "$SUFFIX" in
              nightly*)
                echo "Nightly tag $GH_REF_NAME -- the review gate does not apply."
                exit 0
                ;;
            esac
          fi
          echo "Resolving PR for HEAD $GH_SHA on $GH_REPO..."
          PR=$(gh pr list --repo "$GH_REPO" --state merged --search "sha:$GH_SHA" --json number --jq '.[0].number // empty')
          if [ -z "$PR" ]; then
            echo "::error title=Review gate::HEAD ($GH_SHA) is not associated with any merged PR. Refusing to release un-PR-ed commits."
            exit 1
          fi
          echo "Found PR #$PR — checking review engagement..."
          # Pull author + reviews + comments in one shot so we can correctly
          # exclude self-reviews and detect Qodana's comment-API engagement.
          PR_JSON=$(gh pr view "$PR" --repo "$GH_REPO" --json author,reviews,comments)
          AUTHOR=$(echo "$PR_JSON" | jq -r '.author.login')
          # GitHub's own staleness rule: an APPROVED review is
          # "current" until the same reviewer submits CHANGES_REQUESTED
          # or DISMISSED. A later COMMENTED entry from the same
          # reviewer does NOT supersede their approval (the GitHub UI
          # keeps the green check). Our jq does the same: count a
          # reviewer as approving iff they have at least one APPROVED
          # entry AND no CHANGES_REQUESTED/DISMISSED entry that is
          # newer.
          #
          # Defensive `select(.author != null)` drops reviews from
          # deleted GitHub accounts; otherwise group_by(.author.login)
          # buckets every null-author into a single group and the
          # count diverges from the truth.
          APPROVED=$(echo "$PR_JSON" | jq --arg author "$AUTHOR" '
            [ .reviews
              | map(select(.author != null and .author.login != $author))
              | group_by(.author.login)
              | map({
                  lastApproved:
                    (map(select(.state == "APPROVED") | .submittedAt) | max),
                  lastSupersede:
                    (map(select(.state == "CHANGES_REQUESTED" or .state == "DISMISSED") | .submittedAt) | max),
                })
              | map(select(
                  .lastApproved != null
                  and (.lastSupersede == null or .lastApproved > .lastSupersede)
                ))
            ] | length
          ')
          # Weak signal stays "any non-author review entry of any kind",
          # since Codex always lands a COMMENTED review and is the cheapest
          # bot signal we have when no human approval exists.
          ANY_REVIEW=$(echo "$PR_JSON" | jq --arg author "$AUTHOR" \
            '[.reviews[] | select(.author.login != $author)] | length')
          # Qodana posts as `github-actions[bot]` (login `github-actions`)
          # via the comment API; body starts with `# Qodana ...`. Anchor on
          # the markdown header start to avoid matching arbitrary text that
          # happens to mention Qodana lower in a comment.
          QODANA=$(echo "$PR_JSON" | jq \
            '[.comments[] | select(.author.login=="github-actions" and (.body | startswith("# Qodana")))] | length')
          if [ "$APPROVED" -ge 1 ]; then
            echo "::notice title=Review gate::PR #$PR has $APPROVED approving review(s) from non-authors. Gate passes (strong signal)."
            exit 0
          fi
          if [ "$ANY_REVIEW" -ge 1 ]; then
            echo "::notice title=Review gate::PR #$PR has $ANY_REVIEW non-author review entry/entries (no APPROVED — typically Codex COMMENTED state). Gate passes (weak signal)."
            exit 0
          fi
          if [ "$QODANA" -ge 1 ]; then
            echo "::notice title=Review gate::PR #$PR has $QODANA Qodana scan comment(s) from github-actions and no other reviewer engagement. Gate passes (weak signal — Qodana fallback). Codex was likely rate-limited."
            exit 0
          fi
          echo "::error title=Review gate::PR #$PR has zero non-author reviews AND zero Qodana scan comments. Likely cause: BOTH Codex (rate-limited / disabled) AND Qodana (workflow failure / disabled) failed to engage. Investigate before tagging."
          exit 1

  # ─────────────────────────────────────────────────────────────────────────
  # Tests - must pass BEFORE any build
  # ─────────────────────────────────────────────────────────────────────────
  test:
    name: Run Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    needs: review-gate
    # fail-fast: false — one OS failing shouldn't kill the others; we want
    # to see ALL platform-specific failures in one run, not race-of-the-first.
    # shell: bash so steps work identically on Windows runners (PowerShell's
    # default shell would mangle the gradlew invocation).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Kept in step with the PR matrix in tests.yml -- a release must not be
      # checked against less than a pull request is. Seven suites were listed
      # here while tests.yml ran twenty, so the design system, the widget kernel
      # and all three auth providers were unguarded on the one run that gates a
      # tag.
      - name: Run unit tests
        run: >-
          ./gradlew
          :client-config:test :client-core:test :client-launcher:test :client-update:test
          :client-auth:test :client-auth-smartycraft:test :client-auth-microsoft:test
          :client-cli:test :client-media:test :client-tray:test
          :client-ui:desktopTest :client-i18n:desktopTest :client-render3d:desktopTest
          :client-easter:desktopTest :nx-ui:desktopTest
          :widget-api:test :widget-model:test :widget-processor:test
          :authlib-agent:test :profiler-agent:test
          --continue

      # Gradle's daemon keeps the .lock files under ~/.gradle/caches open for as
      # long as it lives. On Windows another process cannot read an open file, so
      # setup-java's post-job cache save runs tar into "Device or resource busy"
      # on modules-2.lock and five others, and abandons the whole archive. The
      # cache is therefore never written, which is why it is never found either --
      # every Windows run re-downloads the dependencies it already had.
      #
      # POSIX runners have no such rule and save fine, so this is Windows-only.
      - name: Release Gradle's file locks before the cache is saved
        if: always() && runner.os == 'Windows'
        run: ./gradlew --stop

      - name: Upload test reports
        if: always()   # we publish it even if it falls, so we can see what's broken
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          # Every module, not a hand-kept subset -- a suite whose report is not
          # collected is one whose failure has to be read off the raw log.
          path: '*/build/reports/tests/'

  # ─────────────────────────────────────────────────────────────────────────
  # Extract changelog section for this version from CHANGELOG.md
  # ─────────────────────────────────────────────────────────────────────────
  changelog:
    name: Extract Changelog
    runs-on: ubuntu-latest
    needs: test   # tests must pass before we touch artefacts
    outputs:
      notes: ${{ steps.extract.outputs.notes }}
      version: ${{ steps.version.outputs.value }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve version
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "value=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract release notes from CHANGELOG.md
        id: extract
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "notes=No CHANGELOG.md found — see commit history." >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Keep a Changelog format: ## [1.3.0] - 2025-xx-xx
          # Grab everything between the target version header and the next one (or EOF).
          NOTES=$(awk -v ver="$VERSION" '
            /^## \[/ {
              if (found) exit
              if (index($0, "["ver"]") > 0) { found=1; next }
            }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' | sed 's/[[:space:]]*$//')

          # A nightly is cut from the dev tip and never has a section of its own,
          # so the Unreleased one IS its notes -- it describes exactly the work the
          # build contains. Without this every nightly published the same
          # placeholder, and the launcher stitches one per release it is behind, so
          # a tester twelve nightlies back was handed twelve copies of "see the
          # changelog" and nothing else.
          if [ -z "$NOTES" ]; then
            NOTES=$(awk '
              /^## \[/ {
                if (found) exit
                if (index($0, "[Unreleased]") > 0) { found=1; next }
              }
              found { print }
            ' CHANGELOG.md | sed '/./,$!d' | sed 's/[[:space:]]*$//')
          fi

          if [ -z "$NOTES" ]; then
            NOTES="No changelog entry for v${VERSION}. See [CHANGELOG.md](./CHANGELOG.md)."
          fi

          EOF_DELIM=$(openssl rand -hex 8)
          {
            echo "notes<<$EOF_DELIM"
            echo "$NOTES"
            echo "$EOF_DELIM"
          } >> "$GITHUB_OUTPUT"

  # ─────────────────────────────────────────────────────────────────────────
  # WINDOWS — Inno Setup EXE + Portable ZIP
  # ─────────────────────────────────────────────────────────────────────────
  build-windows:
    name: Windows (EXE + ZIP)
    runs-on: windows-latest
    needs: changelog
    env:
      APP_VERSION: ${{ needs.changelog.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build distributable
        shell: bash
        # customJpackageImage produces the same app-image layout that
        # createReleaseDistributable used to (Nexira\bin\,
        # Nexira\lib\runtime\, Nexira\lib\app\), now with
        # the full jlink + jpackage flag surface from the
        # nexira.packaging convention plugin. Inno Setup's Source: path
        # in setup.iss tracks the new output dir (B-3 commit).
        run: ./gradlew :client-ui:customJpackageImage -PappVersion="$APP_VERSION"

      - name: Compile Inno Setup EXE
        shell: pwsh
        run: |
          iscc `
            /DAppVersion="$env:APP_VERSION" `
            /F"Nexira-$env:APP_VERSION-Setup" `
            setup.iss

      - name: Create Portable ZIP
        shell: pwsh
        run: |
          # B-3 follow-up: source dir moves with the packaging swap.
          # customJpackageImage produces Nexira\ directly, without the
          # intermediate app\ directory Compose Desktop put above it, so
          # what the user sees inside the zip is unchanged: Nexira.exe
          # beside its app\ and runtime\ folders, which is the layout
          # portable-readme.txt describes.
          $src = "client-ui\build\customJpackageImage"
          # Drop the bilingual README inside Nexira\ before zipping so
          # users see it immediately on extraction. Without it, the
          # natural-but-wrong "copy just Nexira.exe to Desktop" move
          # produces a cryptic "Nexira.cfg not found" error at launch
          # (see issue #227).
          Copy-Item -Path "packaging\portable-readme.txt" `
                    -Destination "$src\Nexira\README.txt"
          Compress-Archive -Path "$src\*" `
            -DestinationPath "Nexira-$env:APP_VERSION-Windows-Portable.zip"

      - uses: actions/upload-artifact@v7
        with:
          name: windows-artifacts
          path: |
            Nexira-${{ env.APP_VERSION }}-Setup.exe
            Nexira-${{ env.APP_VERSION }}-Windows-Portable.zip

  # ─────────────────────────────────────────────────────────────────────────
  # LINUX — AppImage only
  # ─────────────────────────────────────────────────────────────────────────
  build-linux:
    name: Linux (AppImage)
    runs-on: ubuntu-22.04
    needs: changelog
    env:
      APP_VERSION: ${{ needs.changelog.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # appimagetool is the heaviest single download in the Linux build leg
      # (~30 MB from a `continuous` release tag, republished whenever the
      # upstream main branch rebuilds). Cache hit makes the assembly leg
      # ~20s faster and survives upstream availability blips.
      #
      # Cache key tracks the upstream asset's `updated_at` from the GitHub
      # API -- the timestamp ticks automatically when the continuous build
      # republishes, so cache invalidates without manual rotation. Previous
      # iteration used a calendar suffix (`-2026-05`) that someone had to
      # remember to bump; missing the bump meant building against stale
      # appimagetool until cache eviction caught up.
      - name: Resolve appimagetool cache key from upstream
        id: appimagetool-key
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Falls back to a date-bucketed key if the GH API hiccups so the
          # build proceeds (worst case: cache miss + redownload for that run).
          updated=$(gh api repos/AppImage/appimagetool/releases/tags/continuous \
            --jq '.assets[] | select(.name=="appimagetool-x86_64.AppImage") | .updated_at' 2>/dev/null \
            | tr -d ':-T' || true)
          if [ -z "$updated" ]; then
            updated="fallback-$(date +%Y%m%d)"
          fi
          echo "key=appimagetool-continuous-x86_64-${updated}" >> "$GITHUB_OUTPUT"

      - name: Cache appimagetool
        id: cache-appimagetool
        uses: actions/cache@v6
        with:
          path: appimagetool
          key: ${{ steps.appimagetool-key.outputs.key }}

      - name: Install AppImage tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y fuse libfuse2 desktop-file-utils appstream xmlstarlet
          if [ -f appimagetool ]; then
            sudo install -m 0755 appimagetool /usr/local/bin/appimagetool
          else
            wget -qO appimagetool \
              "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage"
            chmod +x appimagetool
            sudo install -m 0755 appimagetool /usr/local/bin/appimagetool
          fi

      - name: Build JAR + emit packaging profile
        # emitAppImageProfile writes the shell-sourceable flag set that
        # build-appimage.sh below picks up via PACKAGING_PROFILE -- single
        # source of truth between gradle (CustomRuntimeTask) and the
        # AppImage path (jlink call). See PackagingExtension KDoc.
        run: |
          ./gradlew \
            :client-ui:packageReleaseUberJarForCurrentOS \
            :client-ui:emitAppImageProfile \
            -PappVersion="$APP_VERSION"

      - name: Validate desktop entry
        run: desktop-file-validate resources/nexira.desktop

      - name: Validate AppStream metainfo
        run: appstreamcli validate --pedantic resources/dev.hivens.nexira.metainfo.xml

      - name: Inject release entry into metainfo
        run: ./scripts/inject-metainfo-release.sh "$APP_VERSION"

      - name: Build AppImage
        run: |
          JAR=$(ls client-ui/build/compose/jars/*-release*.jar | head -1)
          ./scripts/build-appimage.sh "$APP_VERSION" "$JAR"

      - uses: actions/upload-artifact@v7
        with:
          name: linux-artifacts
          path: Nexira-${{ env.APP_VERSION }}-x86_64.AppImage

  # ─────────────────────────────────────────────────────────────────────────
  # MACOS — DMG (Apple Silicon only in the release pipeline)
  #
  # Compose Desktop's `packageReleaseDmg` produces a host-architecture
  # DMG. macos-latest runners are Apple Silicon since the GH Actions
  # migration in 2024-2025.
  #
  # x86_64 (Intel) build is intentionally absent from the release pipeline.
  # The macos-13 runner (last Intel image GH actively maintains) sits in
  # queue 12+ hours during US workday peaks on the free-tier pool, and
  # `continue-on-error` does NOT help here: it only kicks in once a job
  # finishes (success/failure/cancelled), so a job stuck in queue still
  # blocks any dependent. The Intel DMG is produced separately via the
  # manual `build-macos-x86_64-community.yml` workflow, dispatched by the
  # maintainer against the published tag once macos-13 capacity returns.
  # Intel users therefore see the DMG appear on the GitHub Release page
  # with a delay — usually hours, occasionally days. Acceptable trade-off
  # given the Intel-Mac install base in 2026 and our $0/year budget.
  # The asset is named `-x86_64-community` to make the tier obvious from
  # the filename alone (#164).
  # ─────────────────────────────────────────────────────────────────────────
  build-macos:
    name: macOS (DMG, aarch64)
    needs: changelog
    runs-on: macos-latest
    env:
      APP_VERSION: ${{ needs.changelog.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build DMG
        # customDmg wraps the .app bundle that customJpackageImage
        # produces, into a DMG via `jpackage --type dmg --app-image`.
        # Replaces Compose Desktop's packageReleaseDmg so the macOS
        # leg benefits from the same jlink + jpackage flag set as
        # Windows + Linux (--vm=server, --strip-debug,
        # --include-locales=en,ru,de, etc.). customDmg dependsOn
        # customJpackageImage transitively, so the single gradle
        # invocation here pulls the whole chain.
        run: ./gradlew :client-ui:customDmg -PappVersion="$APP_VERSION"

      - name: Rename DMG with architecture suffix
        run: |
          mv client-ui/build/customDmg/*.dmg \
             "Nexira-$APP_VERSION-aarch64.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: macos-artifacts-aarch64
          path: Nexira-${{ env.APP_VERSION }}-aarch64.dmg

  # ─────────────────────────────────────────────────────────────────────────
  # PORTABILITY GATE — the freshly built AppImage must start across distros
  # before we publish. Reuses appimage-portability.yml against this run's
  # linux-artifacts (not a published asset), so a distro regression blocks the
  # release instead of reaching users. Runs in parallel with the OS builds; it
  # only needs the Linux AppImage.
  # ─────────────────────────────────────────────────────────────────────────
  portability:
    name: AppImage Portability
    needs: build-linux
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/appimage-portability.yml
    with:
      artifact_name: linux-artifacts
    secrets: inherit

  # ─────────────────────────────────────────────────────────────────────────
  # RELEASE — collect artifacts, publish with proper changelog body
  # ─────────────────────────────────────────────────────────────────────────
  release:
    name: Publish GitHub Release
    needs: [changelog, build-windows, build-linux, build-macos, portability]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      APP_VERSION: ${{ needs.changelog.outputs.version }}
    steps:
      # Need the repo source for scripts/compose-release-body.sh that the
      # "Compose release body" step calls below. Without checkout it errors
      # with `./scripts/compose-release-body.sh: No such file or directory`
      # (regression introduced by CI-modernize #6 on PR #128 when the
      # release-body composition was extracted out of inline yaml).
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          # Pattern broadened from `*-artifacts` to `*-artifacts*` so the
          # per-arch macOS suffixes (macos-artifacts-aarch64,
          # macos-artifacts-x86_64) get pulled in alongside the Win/Linux
          # ones. merge-multiple flattens them into a single dist/.
          pattern: '*-artifacts*'
          merge-multiple: true
          path: dist/

      # The redirection creates SHA256SUMS.txt before find enumerates the
      # directory, so without the exclusion find hashed the file while it was
      # still empty and shipped a self-entry of e3b0c442... -- the digest of no
      # bytes. Anyone running `sha256sum -c SHA256SUMS.txt` on a good release got
      # a FAILED line, and compose-release-body.sh rendered that row into the
      # release page's checksum table. The release-manifest step below already
      # skips the file; these two now agree.
      - name: Generate SHA256 checksums
        working-directory: dist
        run: find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -exec sha256sum {} + > SHA256SUMS.txt

      - name: Generate release-manifest.json
        working-directory: dist
        env:
          CHANGELOG_NOTES: ${{ needs.changelog.outputs.notes }}
        run: |
          # Highlights = lines under "### Highlights" up to the next "### "
          HIGHLIGHTS=$(printf '%s' "$CHANGELOG_NOTES" \
            | awk '/^### Highlights/ {flag=1; next} /^### / {flag=0} flag' \
            | sed '/^[[:space:]]*$/d')

          ASSETS_JSON='[]'
          while IFS= read -r line; do
            hash=$(echo "$line" | awk '{print $1}')
            file=$(echo "$line" | awk '{print $2}' | sed 's|^\./||')
            [ -z "$file" ] && continue
            case "$file" in
              SHA256SUMS.txt|release-manifest.json) continue ;;
            esac

            case "$file" in
              *Setup.exe)             plat=windows; kind=installer ;;
              *Windows-Portable.zip)  plat=windows; kind=portable  ;;
              *.AppImage)             plat=linux;   kind=appimage  ;;
              *aarch64.dmg)           plat=macos;   kind=dmg-arm64 ;;
              *x86_64.dmg)            plat=macos;   kind=dmg-intel ;;
              *.dmg)                  plat=macos;   kind=dmg       ;;
              *)                      plat=unknown; kind=unknown   ;;
            esac

            size=$(stat -c%s "$file")
            ASSETS_JSON=$(echo "$ASSETS_JSON" \
              | jq --arg n "$file" --arg p "$plat" --arg k "$kind" \
                   --arg s "$hash" --argjson sz "$size" \
                   '. + [{"name": $n, "platform": $p, "kind": $k, "sha256": $s, "size": $sz}]')
          done < SHA256SUMS.txt

          PUBLISHED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          jq -n \
            --arg ver "$APP_VERSION" \
            --arg pub "$PUBLISHED_AT" \
            --arg hl "$HIGHLIGHTS" \
            --argjson assets "$ASSETS_JSON" \
            '{
              schemaVersion: 1,
              version: $ver,
              publishedAt: $pub,
              highlights: (if $hl == "" then null else $hl end),
              assets: $assets
            }' > release-manifest.json

      - name: Compose release body
        id: body
        env:
          CHANGELOG_NOTES: ${{ needs.changelog.outputs.notes }}
        run: |
          EOF_DELIM=$(openssl rand -hex 8)
          {
            echo "body<<$EOF_DELIM"
            ./scripts/compose-release-body.sh
            echo "$EOF_DELIM"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v3
        with:
          name: Nexira v${{ env.APP_VERSION }}
          body: ${{ steps.body.outputs.body }}
          files: dist/*
          draft: false
          # generate_release_notes intentionally OFF: GitHub's auto section is also
          # titled "What's Changed" and duplicated our curated CHANGELOG section of
          # the same name on the release page (and the in-app updater parses the
          # first "## What's Changed"). The composed body is the single source.
          prerelease: ${{ contains(needs.changelog.outputs.version, '-') }}
