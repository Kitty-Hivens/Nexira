name: Build and Publish (JDK 25 + JBR SDK)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-all:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            format: msi
            artifact_name: windows-files
          - os: ubuntu-latest
            format: deb rpm appimage
            artifact_name: linux-files
          - os: macos-latest
            format: dmg
            artifact_name: macos-file
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # 1. Загрузка JBR 25.0.1b268.49
      - name: Setup JetBrains Runtime 25
        shell: bash
        run: |
          TAG="jbr-release-25.0.1b268.49"
          BASE_URL="https://github.com/JetBrains/JetBrainsRuntime/releases/download/$TAG"
          
          echo "Downloading from $BASE_URL..."
          
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            FILE="jbrsdk-25.0.1-windows-x64-b268.49.zip"
            # -f заставит curl упасть, если URL битый (не скачивая 9 байт)
            curl -fL "$BASE_URL/$FILE" -o jbr.zip
            7z x jbr.zip -ojbr_root
            mv jbr_root/jbrsdk*/* . || mv jbr_root/*/* .
          elif [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            FILE="jbrsdk-25.0.1-linux-x64-b268.49.tar.gz"
            curl -fL "$BASE_URL/$FILE" -o jbr.tar.gz
            tar -xzf jbr.tar.gz --strip-components=1
          else
            FILE="jbrsdk-25.0.1-osx-x64-b268.49.tar.gz"
            curl -fL "$BASE_URL/$FILE" -o jbr.tar.gz
            tar -xzf jbr.tar.gz --strip-components=1
          fi
          
          echo "JAVA_HOME=$(pwd)" >> $GITHUB_ENV
          echo "$(pwd)/bin" >> $GITHUB_PATH

      - name: Verify Java
        run: java -version

      - uses: gradle/actions/setup-gradle@v3

      - name: Install Linux Build Tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libgl1-mesa-dri xorg-dev rpm binutils libfuse2 file

      # 2. Сборка всех форматов (включая AppImage и RPM)
      - name: Package Application
        shell: bash
        run: |
          chmod +x gradlew
          ./gradlew clean :client-ui:packageDistribution \
          $(echo "${{ matrix.format }}" | sed 's/\([^ ]*\)/:client-ui:package\u\1/g') \
          -Pversion=${{ github.ref_name }} \
          -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

      # 3. Сбор артефактов
      - name: Collect Artifacts
        shell: bash
        run: |
          # Копируем всё, что Gradle успел собрать в binaries
          find client-ui/build/compose/binaries -name "*.msi" -exec cp {} AuraLauncher-Setup.msi \; 2>/dev/null || true
          find client-ui/build/compose/binaries -name "*.deb" -exec cp {} AuraLauncher.deb \; 2>/dev/null || true
          find client-ui/build/compose/binaries -name "*.rpm" -exec cp {} AuraLauncher.rpm \; 2>/dev/null || true
          find client-ui/build/compose/binaries -name "*.dmg" -exec cp {} AuraLauncher.dmg \; 2>/dev/null || true
          find client-ui/build/compose/binaries -name "*.AppImage" -exec cp {} AuraLauncher.AppImage \; 2>/dev/null || true
          
          # Для Windows Portable
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            powershell "Compress-Archive -Path client-ui/build/compose/binaries/main/app/* -DestinationPath AuraLauncher-Win-Portable.zip"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.msi
            *.zip
            *.AppImage
            *.deb
            *.rpm
            *.dmg
          if-no-files-found: warn

  publish-release:
    name: Create Release
    needs: build-all
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          files: artifacts/*
