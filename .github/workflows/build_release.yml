name: Build and Publish (JDK 25 + JBR SDK)

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-all:
    name: Build on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            tasks: "packageMsi packageDistribution"
            artifact_name: windows-files
          - os: ubuntu-latest
            tasks: "packageDeb packageRpm packageAppImage"
            artifact_name: linux-files
          - os: macos-latest
            tasks: "packageDmg"
            artifact_name: macos-file
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup JetBrains Runtime 25
        shell: bash
        run: |
          BASE_URL="https://cache-redirector.jetbrains.com/intellij-jbr"
          VERSION="25.0.1"
          BUILD="b268.49"
          mkdir -p $GITHUB_WORKSPACE/jbr_home
          
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            FILE="jbrsdk-$VERSION-windows-x64-$BUILD.tar.gz"
            curl -fL "$BASE_URL/$FILE" -o jbr.tar.gz
            tar -xzf jbr.tar.gz -C $GITHUB_WORKSPACE/jbr_home --strip-components=1
          elif [ "${{ matrix.os }}" == "ubuntu-latest" ]; then
            FILE="jbrsdk-$VERSION-linux-x64-$BUILD.tar.gz"
            curl -fL "$BASE_URL/$FILE" -o jbr.tar.gz
            tar -xzf jbr.tar.gz -C $GITHUB_WORKSPACE/jbr_home --strip-components=1
          else
            FILE="jbrsdk-$VERSION-osx-aarch64-$BUILD.tar.gz"
            curl -fL "$BASE_URL/$FILE" -o jbr.tar.gz
            tar -xzf jbr.tar.gz -C $GITHUB_WORKSPACE/jbr_home --strip-components=1
          fi
          
          # Для macOS путь может быть глубже
          if [ "${{ matrix.os }}" == "macos-latest" ]; then
             REAL_PATH=$(find $GITHUB_WORKSPACE/jbr_home -name "Home" -type d | head -n 1 || echo "$GITHUB_WORKSPACE/jbr_home")
             echo "JAVA_HOME=$REAL_PATH" >> $GITHUB_ENV
             echo "$REAL_PATH/bin" >> $GITHUB_PATH
          else
             echo "JAVA_HOME=$GITHUB_WORKSPACE/jbr_home" >> $GITHUB_ENV
             echo "$GITHUB_WORKSPACE/jbr_home/bin" >> $GITHUB_PATH
          fi

      - name: Verify Java
        run: java -version

      - uses: gradle/actions/setup-gradle@v3

      - name: Install Linux Build Tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libgl1 libgl1-mesa-dri xorg-dev rpm binutils libfuse2 file

      # 2. Сборка
      - name: Package Application
        shell: bash
        run: |
          chmod +x gradlew
          # Запускаем задачи из матрицы напрямую
          ./gradlew clean :client-ui:packageDistribution \
          $(echo "${{ matrix.tasks }}" | sed 's/\([^ ]*\)/:client-ui:\1/g') \
          -Pversion=${{ github.ref_name }} \
          -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC"

      # 3. Сбор артефактов
      - name: Collect Artifacts
        shell: bash
        run: |
          # Собираем всё, что Gradle выплюнул в binaries
          find client-ui/build/compose/binaries -name "*.msi" -exec cp {} AuraLauncher-Setup.msi \; 2>/dev/null || true
          find client-ui/build/compose/binaries -name "*.deb" -exec cp {} AuraLauncher.deb \; 2>/dev/null || true
          find client-ui/build/compose/binaries -name "*.rpm" -exec cp {} AuraLauncher.rpm \; 2>/dev/null || true
          find client-ui/build/compose/binaries -name "*.dmg" -exec cp {} AuraLauncher.dmg \; 2>/dev/null || true
          find client-ui/build/compose/binaries -name "*.AppImage" -exec cp {} AuraLauncher.AppImage \; 2>/dev/null || true
          
          # Для Windows Portable
          if [ "${{ matrix.os }}" == "windows-latest" ]; then
            powershell "Compress-Archive -Path client-ui/build/compose/binaries/main/app/* -DestinationPath AuraLauncher-Win-Portable.zip"
          fi

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: |
            *.msi
            *.zip
            *.AppImage
            *.deb
            *.rpm
            *.dmg
          if-no-files-found: warn

  publish-release:
    name: Create Release
    needs: build-all
    runs-on: ubuntu-latest
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref, '-') }}
          files: artifacts/*
