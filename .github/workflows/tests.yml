name: Tests

# Unit-test matrix on every code PR and every code push to a working branch.
#
# build_release.yml runs these suites on a release tag -- so OS-specific
# regressions stayed invisible until a tag was cut (that is how a macOS
# native-classifier assumption and Windows path-separator asserts once reached a
# release and blocked it). This workflow runs them at PR time instead.
#
# dev is in the push list because work lands there as direct commits, not as
# pull requests. Without it the first run of any test on that code is the nightly
# tag, which puts hours and a stack of unrelated commits between a break and the
# report -- exactly the gap that let a macOS-only watch assumption and a
# composition that never rendered both reach a nightly.
#
# Full 3-OS matrix, deliberately NOT Linux-only: the failures that motivated
# this were all green on Linux, so a Linux-only PR run would not have caught
# them. The repo is public, so GitHub-hosted minutes are free on every OS.
#
# Docs-only PRs (CHANGELOG, *.md) do not touch the paths below, so they skip
# the matrix entirely.

on:
  pull_request:
    paths:
      - '**.kt'
      - '**.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/tests.yml'
  push:
    branches: [dev, stable]
    # Same filter as the PR trigger: a CHANGELOG or docs commit on dev should not
    # spend a three-OS matrix.
    paths:
      - '**.kt'
      - '**.kts'
      - 'gradle/**'
      - 'gradle.properties'
      - '.github/workflows/tests.yml'

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '26'
  JAVA_DISTRIBUTION: 'liberica'

jobs:
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # fail-fast: false so one OS failing still reports the others -- we want
    # every platform-specific failure in one run, not race-of-the-first.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    # shell: bash so the gradlew invocation is identical on Windows runners
    # (PowerShell's default would mangle it).
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
          cache: 'gradle'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # client-ui carries the UI suites, including the off-screen render tests
      # that draw through Skiko. They need no display -- verified with DISPLAY
      # and WAYLAND_DISPLAY unset -- and its one wall-clock assertion holds on a
      # single starved core. The video-transcode test opts in through
      # NEXIRA_TEST_VIDEO and no-ops without it, so no media natives are needed.
      #
      # Every module that has tests is listed. A suite left out of this line is a
      # suite nobody runs: the widget kernel's default-layout drift guard sat red
      # on both branches through several releases because :widget-model:test was
      # absent here. The rest are pure JVM -- no display, no native tray, no
      # network, no spawned yt-dlp -- so they cost seconds and cover the design
      # system, the widget kernel, all three auth providers and both java agents.
      - name: Run unit tests
        run: >-
          ./gradlew
          :client-config:test :client-core:test :client-launcher:test :client-update:test
          :client-auth:test :client-auth-smartycraft:test :client-auth-microsoft:test
          :client-cli:test :client-media:test :client-tray:test
          :client-ui:desktopTest :client-i18n:desktopTest :client-render3d:desktopTest
          :client-easter:desktopTest :nx-ui:desktopTest
          :widget-api:test :widget-model:test :widget-processor:test
          :authlib-agent:test :profiler-agent:test
          --continue

      # The runtime-module guard is a config-time read with no compilation behind
      # it, so it costs nothing here and fails a bad module list at PR time rather
      # than when a tag is cut and the packaging tasks finally run it.
      - name: Verify runtime modules
        run: ./gradlew :client-ui:verifyRuntimeModules

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-${{ matrix.os }}
          # Every module, not a hand-kept subset -- a suite whose report is not
          # collected is one whose failure has to be read off the raw log.
          path: '*/build/reports/tests/'
