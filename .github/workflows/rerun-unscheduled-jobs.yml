name: Rerun jobs that never got a runner

# GitHub sometimes fails to hand out a hosted runner (macOS arm64 capacity in
# particular): the job is marked failed with no runner and no steps executed.
# That says nothing about the code, so the failed jobs are run again, up to
# three attempts in total. A job that did start and failed is never rerun here.

on:
  workflow_run:
    workflows: [Tests, Release]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  rerun:
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-26.04
    steps:
      - name: Rerun failed jobs that were never scheduled
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          unscheduled=$(gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=latest" --paginate \
            -q '[.jobs[] | select(.conclusion == "failure" and ((.runner_name // "") == "") and ([.steps[] | select(.conclusion != null and .conclusion != "skipped")] | length == 0))] | length')
          echo "unscheduled failed jobs: $unscheduled"
          if [ "$unscheduled" -gt 0 ]; then
            gh run rerun "$RUN_ID" --failed --repo "$REPO"
          fi
