jvmPerfDisableExplicitGcHint=System.gc() zu No-op machen. Manche Legacy-Mods missbrauchen es. Fast immer ein Gewinn.
jvmPerfUseLargePagesHint=Benötigt vorab via sysctl allozierte Hugepages. ~2-5% Performance-Gewinn wenn richtig eingerichtet.
jvmPerfTransparentHugePagesHint=Einfacher als UseLargePages. Verursacht Latenz-Spitzen bei Defrag. Trade-off.
jvmPerfNumaHint=NUMA-bewusste Allokation. Nur auf Multi-Socket-Systemen sinnvoll.
