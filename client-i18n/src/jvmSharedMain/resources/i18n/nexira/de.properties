# Settings: Advanced (updates, launch, data directory)
settingsSectionUpdates=Updates
settingsSectionLaunch=Start
settingsPreReleases=Vorabversionen
settingsPreReleasesDesc=Beta-Builds erhalten, bevor sie stabil werden.
settingsMandatoryUpdates=Pflicht-Updates
settingsMandatoryUpdatesDesc=Den Start blockieren, bis kritische Updates installiert sind, wenn die Upstream-Protokoll-Kompatibilität bricht. Standardmäßig aus: die Untergrenze kann auch den eigenen Start blockieren, sie zu befolgen ist deshalb eine bewusste Entscheidung.
settingsAutoUpdatePacks=Installierte Instanzen automatisch aktualisieren
settingsAutoUpdatePacksDesc=Hält installierte Pack-Instanzen auf dem neuesten Build. Sichere Updates laufen im Hintergrund; eine Minecraft- oder Loader-Änderung folgt der Regel darunter. Ausschalten, um sie von Hand zu aktualisieren.
settingsAmberPolicy=Wenn ein Build Minecraft oder den Loader ändert
settingsAmberPolicyDesc=Ein anstehender Build wird mit dem installierten nach Minecraft-Version, Loader-Familie und Loader-Version verglichen. Eine neuere Loader-Version wird von selbst übernommen; eine andere Minecraft-Version oder eine andere Loader-Familie kann Welten, Konfigurationen und Mod-Zustand entwerten — dafür gilt diese Regel. Vor dem Anwenden wird immer ein Wiederherstellungspunkt angelegt, und wer den aktuellen Build behält, bekommt zudem keine Erinnerungen. Gilt nur für Mirror-Instanzen: ein SmartyCraft-Client wird so nicht eingestuft.
settingsAmberPolicyAsk=Nachfragen
settingsAmberPolicyApply=Automatisch anwenden
settingsAmberPolicyHold=Aktuellen Build behalten
settingsJvmBuilder=Visueller JVM-Argument-Builder
settingsJvmBuilderDesc=Zeigt einen „Argumente bauen“-Button in den Server-Einstellungen. Wähle Garbage Collector, justiere Heap-Regionen, aktiviere AppCDS oder JFR — ohne Flags auswendig zu lernen. Vorgaben: Aikar's Rezept, GTNH-Klasse, ZGC für große Heaps und mehr.
settingsAdaptiveMemory=Adaptiver Speicher
settingsAdaptiveMemoryDesc=Verfeinert den Heap jeder Instanz anhand des realen Verbrauchs über einige Sitzungen, aufbauend auf dem automatischen RAM-basierten Basiswert. Festen RAM-Wert setzen, um eine Instanz auszunehmen; ausschalten, um den automatischen Basiswert ohne Lernen zu behalten.
settingsMimicVersion=Launcher-Version-Override
settingsMimicVersionDesc=Fixiert den Versions-String, der an den Upstream im Handshake und User-Agent gesendet wird. Leer lassen für den eingebauten Standard — nur setzen, wenn der Upstream seine Versions-Anforderung schneller anhebt als Nexiras Release-Zyklus. Wirkt beim nächsten Protokoll-Aufruf nach Speichern, kein Neustart nötig.
settingsMimicVersionPlaceholder=Standard: {0}
widgetProgressTitle=Hintergrundaktivität
widgetProgressIdle=Momentan wird nichts heruntergeladen.
widgetTabDefaultLabel=Tab {0}

