# Settings: Advanced (updates, launch, data directory)
settingsSectionUpdates=Обновления
settingsSectionLaunch=Запуск
settingsPreReleases=Пре-релизы
settingsPreReleasesDesc=Получать бета-сборки до перевода в стабильные.
settingsMandatoryUpdates=Обязательные обновления
settingsMandatoryUpdatesDesc=Блокировать запуск до установки критических обновлений, когда ломается совместимость с протоколом. По умолчанию выключено: порог может заблокировать и твой собственный запуск, поэтому его соблюдение — осознанный выбор.
settingsAutoUpdatePacks=Автообновление установленных инстансов
settingsAutoUpdatePacksDesc=Держать установленные инстансы зеркала на последней версии. Безопасные обновления ставятся в фоне; смена версии Minecraft или загрузчика идёт по правилу ниже. Выключи, чтобы обновлять вручную.
settingsAmberPolicy=Когда сборка меняет Minecraft или загрузчик
settingsAmberPolicyDesc=Новая сборка сравнивается с установленной по версии Minecraft, семейству загрузчика и его версии. Более новая версия загрузчика ставится сама; другая версия Minecraft или другое семейство загрузчика могут испортить миры, конфиги и состояние модов — вот для этого случая правило ниже. Точка восстановления снимается всегда перед применением, а вариант с текущей сборкой ещё и убирает напоминания. Касается только инстансов с зеркала: клиенты SmartyCraft так не размечаются.
settingsAmberPolicyAsk=Спрашивать
settingsAmberPolicyApply=Ставить автоматически
settingsAmberPolicyHold=Остаться на текущей
settingsJvmBuilder=Визуальный конструктор JVM-аргументов
settingsJvmBuilderDesc=Показывает кнопку «Собрать аргументы» в настройках сервера. Выбираешь сборщик мусора, настраиваешь регионы хипа, включаешь AppCDS или JFR — без необходимости помнить флаги. Готовые пресеты: Aikar's recipe, GTNH-класс, ZGC для больших хипов и другие.
settingsAdaptiveMemory=Адаптивная память
settingsAdaptiveMemoryDesc=Уточняет размер хипа каждой сборки по реальному потреблению за несколько сессий, поверх автоматического базового значения от ОЗУ машины. Зафиксируй конкретное значение RAM, чтобы исключить сборку; выключи, чтобы оставить автоматическую базу без обучения.
settingsMimicVersion=Подмена версии лаунчера
settingsMimicVersionDesc=Зафиксировать строку версии, которая отправляется в рукопожатии и User-Agent. Оставь пустым для стандартного значения — заполни только если апстрим успел поднять свою версию быстрее цикла релизов Nexira. Применяется на следующем запросе к протоколу после сохранения, перезапуск не требуется.
settingsMimicVersionPlaceholder=По умолчанию: {0}
