jvmGcHeader=Garbage Collector
jvmGcG1Hint=Recommended for modded MC, 4-32 GB heap.
jvmGcZHint=Sub-millisecond pauses. Java 17+, 16+ GB heap. Generational on Java 21+.
jvmGcShenandoahHint=Concurrent low-pause from OpenJDK / Liberica. Java 17+.
jvmGcParallelHint=Throughput-first. Long stop-the-world pauses. Almost never the right pick.
jvmGcSerialHint=Single-threaded. Tiny heaps only (< 1 GB).
jvmG1Header=G1GC tuning
jvmG1MaxPauseMillisHint=Target max pause time. Lower = more frequent collections.
jvmG1RegionSizeHint=Region size in MB. Larger = fewer regions, less metadata.
jvmG1NewSizePercentHint=Min young generation as % of heap. Aikar: 30.
jvmG1MaxNewSizePercentHint=Max young generation as % of heap. Aikar: 40.
jvmG1IhopHint=When mixed GC starts. Aikar: 15 (eager). Stock: 45.
jvmG1ParallelRefProcHint=Process references in parallel. Pure win on multi-core.
jvmG1PerfDisableSharedMemHint=Skip /tmp/hsperfdata. Stops VisualVM but improves disk hygiene.
jvmZHeader=ZGC tuning
jvmZGenerationalHint=Java 21+ only. Splits heap into young / old. Significantly better than non-generational.
jvmShenandoahHeader=Shenandoah heuristic
jvmShenandoahAdaptiveHint=Default. Balances pause vs throughput.
jvmShenandoahStaticHint=Trigger collection at fixed thresholds.
jvmShenandoahCompactHint=Aggressive compaction. Better at memory reclaim.
jvmShenandoahAggressiveHint=Continuous collection. High throughput cost.
jvmTuningNotApplicable=No tuning available for {0}. Switch to G1, Z, or Shenandoah on the GC tab.
jvmCdsHeader=Application Class Data Sharing
jvmCdsIntro=Cache the loaded class metadata across launches. For 200+ mod packs, saves 1-3 seconds on every cold start after the first.
jvmCdsModeDisabledLabel=Disabled
jvmCdsModeDisabledHint=No CDS. Default.
jvmCdsModeAutoLabel=Auto-archive (Java 19+)
jvmCdsModeAutoHint=JVM auto-manages the archive at exit. No path needed.
jvmCdsModeArchiveLabel=Archive at exit
jvmCdsModeArchiveHint=Write archive to your specified path on shutdown.
jvmCdsModeUseLabel=Use existing archive
jvmCdsModeUseHint=Read pre-built archive from your specified path.
jvmCdsArchivePathLabel=Archive path
jvmJitHeader=JIT compiler
jvmJitTieredHint=On = warm-up via interpreter then C1 then C2 (default). Off = C2 only, slower start.
jvmJitCodeCacheHint=Size of JIT-compiled code cache. JVM default is 240. Modded MC may benefit from 512+.
jvmPerfHeader=Performance & OS-level flags
jvmPerfAlwaysPreTouchHint=Touch every heap page at startup. Slower start, more consistent runtime.
jvmPerfDisableExplicitGcHint=Make System.gc() a no-op. Some legacy mods abuse it. Almost always a win.
jvmPerfUseLargePagesHint=Requires hugepages pre-allocated via sysctl. ~2-5% perf gain when set up.
jvmPerfTransparentHugePagesHint=Easier than UseLargePages. Adds latency spikes during defrag. Trade-off.
jvmPerfNumaHint=NUMA-aware allocation. Only useful on multi-socket systems.
jvmPerfHeapDumpHint=Write a heap dump on OOM. Crucial for diagnostics.
jvmPerfExitOnOomHint=Exit on OOM instead of trying to limp along. Prevents zombie game state.
jvmJfrHeader=Java Flight Recorder
jvmJfrIntro=Records JVM internals (allocations, GC, threads, locks). Open the resulting .jfr in JDK Mission Control or IntelliJ for analysis.
jvmJfrEnableLabel=Enable JFR recording
jvmJfrEnableHint=Default settings = ~1% overhead. Profile settings = ~5%, captures method-level.
jvmJfrDurationLabel=Duration (minutes)
jvmJfrSettingsHeader=Settings preset
