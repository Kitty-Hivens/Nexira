# Settings: Advanced (updates, launch, data directory)
settingsSectionUpdates=Updates
settingsSectionLaunch=Launch
settingsPreReleases=Pre-release updates
settingsPreReleasesDesc=Receive beta builds before they are promoted to stable.
settingsMandatoryUpdates=Mandatory updates
settingsMandatoryUpdatesDesc=Block startup until critical updates are installed when the upstream protocol breaks. Off by default: the floor can block your own startup, so honouring it is a deliberate choice.
settingsAutoUpdatePacks=Auto-update installed instances
settingsAutoUpdatePacksDesc=Keep installed pack instances on the latest build. Safe updates apply in the background; a Minecraft or loader change follows the policy below. Turn off to update them by hand.
settingsAmberPolicy=When a build changes Minecraft or the loader
settingsAmberPolicyDesc=A pending build is compared against the installed one by Minecraft version, loader family and loader version. A newer loader version re-syncs on its own; a different Minecraft version or a different loader family can invalidate worlds, configs and mod state, so this decides what happens then. A restore point is taken before anything is applied, and keeping the current build also stops the reminders. Mirror instances only — a SmartyCraft client is not graded this way.
settingsAmberPolicyAsk=Ask me
settingsAmberPolicyApply=Apply automatically
settingsAmberPolicyHold=Keep current build
settingsJvmBuilder=Visual JVM args builder
settingsJvmBuilderDesc=Reveals a 'Build args' button in the per-server constructor. Pick a GC algorithm, tune heap regions, enable AppCDS or JFR profiling — without memorizing flags. Curated presets cover Aikar's recipe, GTNH-class heavy modded, ZGC for huge heaps, and more.
settingsAdaptiveMemory=Adaptive memory
settingsAdaptiveMemoryDesc=Refines each instance's heap from real usage over a few sessions, on top of the automatic machine-based baseline. Pin a specific RAM value to opt an instance out; turn this off to keep the automatic baseline without learning.
settingsMimicVersion=Mimic launcher version override
settingsMimicVersionDesc=Pin the version string sent to upstream in the handshake and User-Agent. Leave blank to use the shipped default — set this only when upstream has bumped its version pin faster than Nexira's release cycle. Takes effect on the next protocol call after save; no restart needed.
settingsMimicVersionPlaceholder=Default: {0}
widgetProgressTitle=Background activity
widgetProgressIdle=Nothing is downloading right now.
widgetTabDefaultLabel=Tab {0}

