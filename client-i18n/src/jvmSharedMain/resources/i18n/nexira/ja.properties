settingsAmberPolicy=ビルドで Minecraft かローダーが変わるとき
settingsAmberPolicyDesc=保留中のビルドを、導入済みのものと Minecraft のバージョン、ローダーの系統、ローダーのバージョンで比べます。ローダーのバージョンだけが新しい場合はそのまま再同期します。Minecraft のバージョンが違う場合やローダーの系統が違う場合は、ワールド、設定、Mod の状態が壊れることがあるため、この設定でどうするかを決めます。適用の前には復元ポイントを取り、現在のビルドを保つ選択をすれば通知も止まります。対象はミラーのインスタンスだけで、SmartyCraft クライアントはこの判定を受けません。
settingsAmberPolicyAsk=都度たずねる
settingsAmberPolicyApply=自動で適用
settingsAmberPolicyHold=現在のビルドを保つ
settingsJvmBuilder=JVM 引数のビジュアル作成
