settingsAdaptiveMemory=適応メモリ
settingsAdaptiveMemoryDesc=機械の性能から決めた自動の基準値に加えて、数回のセッションの実使用量から各インスタンスのヒープを調整します。特定のメモリ量を固定するとそのインスタンスは対象外になります。学習せず自動の基準値だけを使いたい場合はオフにしてください。
