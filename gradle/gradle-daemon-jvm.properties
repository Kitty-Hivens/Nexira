# Gradle Daemon JVM Criteria. The build daemon -- and the Gradle workers it
# spawns, including the KSP annotation processor which loads processor classes
# compiled to Java 26 bytecode -- must run on JDK 26, matching the compile
# toolchain in the root build. A JDK 25 daemon cannot load the class-file
# version 70 the :widget-processor jar is built to (UnsupportedClassVersionError
# in kspKotlinDesktop).
#
# Version-only and vendor-loose: Gradle auto-detects any locally installed JDK 26
# (CI provides it via setup-java; foojay's per-platform download URLs that
# `updateDaemonJvm` also emits are omitted on purpose -- they pin opaque,
# non-auditable vendor builds and rot over time). If no JDK 26 is detected the
# build fails with a clear message; install one. The compile-side toolchain keeps
# its own foojay auto-download safety net (see settings.gradle.kts).
toolchainVersion=26
