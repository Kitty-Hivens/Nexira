# Single source of truth for dependency and plugin versions.
# Referenced from each subproject's build.gradle.kts via the `libs` accessor.
# Use ./gradlew dependencyUpdates to surface candidates.

[versions]
# ── Toolchain & language plugins ─────────────────────────────────────────────
kotlin            = "2.4.10"
compose           = "1.11.1"
buildconfigPlugin = "6.0.10"
versionsPlugin    = "0.60.0"
# ksp tracks its own release line, decoupled from the Kotlin version. 2.3.10 is
# the latest published KSP; KSP2 runs on the Analysis API and compiles cleanly
# against the Kotlin 2.4.10 toolchain here (:widget-processor / :client-ui
# kspKotlinDesktop both green). Bump when a newer KSP ships; it does not need to
# match the Kotlin minor.
ksp               = "2.3.11"

# ── Core libraries ───────────────────────────────────────────────────────────
ktor              = "3.5.2"
# Test-only. Pinned to whatever ktor-client-okhttp resolves, so the
# certificate helper matches the TLS stack under test.
okhttp            = "5.4.0"
koin              = "4.2.2"
xodus             = "2.0.1"
serialization     = "1.11.0"
coroutines        = "1.11.0"

# ── UI / Compose ecosystem ───────────────────────────────────────────────────
# composeMaterial3 tracks JetBrains' separately-published material3 artifact,
# which lags Compose-MP core by ~2 release lines. core 1.11.1 shipped but
# material3 has no 1.10.x / 1.11.x stable; 1.11.0-alpha07 is the JetBrains-paired
# alpha for the 1.11 line. 1.12.0-alpha03 exists but pairs with compose 1.12-beta,
# so it stays parked until compose core moves to 1.12 stable.
composeMaterial3  = "1.11.0-alpha07"
# androidx graphics-shapes -- rounded polygons with corner SMOOTHING (squircles)
# and star/polygon outlines, which RoundedCornerShape cannot express. Already on
# the classpath transitively; declared so the source depends on it deliberately.
# The desktop artifact has no Compose-Path bridge, so nx-ui builds the path from
# the cubics itself (see PolygonShape).
graphicsShapes    = "1.1.0"
markdownRenderer  = "0.43.0"
# org.jetbrains:markdown -- md->html parser under markdown-m3, used directly by the in-launcher HTML renderer (hivens.ui.render).
markdown          = "0.7.9"
# jsoup -- HTML parsing for the in-launcher HTML renderer.
jsoup             = "1.23.1"
# Coil 3 -- async image loading (pack + mod icons, Browse cards). Deliberately no
# library aliases: the KMP source-set block has to exclude Coil's skiko copy, and
# implementation(<catalog accessor>) { ... } is rejected there (Provider vs String),
# so client-ui builds the coordinates off this version instead.
coil              = "3.5.0"

# SVG rasteriser for pack descriptions. Skia's own SVG module is what the image
# loader uses on this platform and it draws no text at all -- a shields.io badge
# came out as two blank colour blocks -- and skiko exposes no way to hand it a
# font manager. Chosen over Batik for being a fraction of the size and for having
# no script engine and no external-entity resolution to switch off: description
# markup is written by third parties.
jsvg              = "2.0.0"
# Material You colour science (Monet) -- pure Kotlin port, no Compose dep.
# Seeds a tonal palette from the wallpaper; mapped onto NxColors.
materialColorUtils = "5.0.0"
filekit           = "0.14.2"

# ── Logging ──────────────────────────────────────────────────────────────────
slf4j             = "2.0.18"
logback           = "1.6.1"

# ── Misc runtime ─────────────────────────────────────────────────────────────
commonsCompress   = "1.28.0"
jbsdiff           = "1.0"

# Pure-Panama tray library (Kitty-Hivens/libtray) -- replaces dorkbox/SystemTray
# for the native tray icon. Now on Maven Central as dev.hivens:libtray
# (resolved from mavenCentral; the jitpack repo is no longer needed for it).
# Pinned to a released semver so upstream changes don't silently land here.
# 0.1.1: backend hardening -- fixes a DBusMessageIter buffer overflow (heap
# corruption on every iterator call), native-memory leaks, watcher
# re-registration (#10), and main-queue marshaling (#3).
# 0.1.2: private D-Bus connection (dbus_bus_get_private) so a sibling libdbus
# user's pump (libnotify, libvault) can't steal the tray host's property queries
# off the shared bus -- the tray icon now renders on cold start.
# 0.1.3: the polling thread answers the tray host itself, so a reply is no
# longer held until the pump's poll interval expires -- opening the menu cost
# ~1s per D-Bus round trip. Icon pixmaps marshal in one call instead of one
# downcall per byte, and oversized icons are scaled before a backend sees them.
libtray           = "0.1.3"

# Pure-Panama desktop notifications (Kitty-Hivens/libnotify) -- freedesktop
# Notifications over D-Bus on Linux, WinRT toast on Windows, NSUserNotification
# on macOS. Used for the OS-level "still running in the tray" hint, distinct
# from the in-app NotificationCenter. Maven Central as dev.hivens:libnotify.
# 0.1.1: same DBusMessageIter buffer-overflow + arena-leak fixes as libtray.
# 0.1.2: private D-Bus connection -- same shared-bus message-theft fix as libtray.
libnotify         = "0.1.2"

# Pure-Panama secret storage (Kitty-Hivens/libvault) -- OS keyring (Secret
# Service / Credential Manager / Keychain) with an AES-256-GCM file fallback.
# Replaces the in-tree IKeyringStorage + 4 native impls + the AES fallback that
# lived inside CredentialsManager. Same dev.hivens family, mavenCentral.
# 0.2.1: private D-Bus connection -- same shared-bus message-theft fix as libtray.
libvault          = "0.2.1"

# Media decode/playback (Kitty-Hivens/skinema) -- FFmpeg via Panama, frames
# out as Skia images, fail-closed/drop-late, built for looping backgrounds.
# Replaces the in-tree Skia-Codec animation path in CustomBackground and adds
# video wallpapers. dev.hivens family, mavenCentral; decode-only LGPL FFmpeg +
# libwebp + libass ship in per-platform skinema-natives classifier jars.
# 0.7.0: packaging only -- no API change and no decode change from 0.6.2. The
# natives moved off the library's version line onto their own (skinemaNatives
# below), so these two versions no longer match and are not meant to.
skinema           = "0.7.0"

# The natives are versioned as the FFmpeg build they carry plus a repack
# revision, not as the library: skinema names the natives version it pairs
# with in its release notes, and that version stays put across library
# releases that do not touch the bundles. 8.1.1-1 is the same FFmpeg 8.1.1
# that shipped with skinema 0.6.2, liblzma-5.dll fix included.
skinemaNatives    = "8.1.1-1"

# ── Test ─────────────────────────────────────────────────────────────────────
# One version for the whole platform: JUnit 6 merged the Jupiter 5.x and Platform
# 1.x lines that used to be tracked apart. The agents held the build on 5.x while
# their test compilation inherited release 8 from the shipped-agent pin; only the
# agent classes need Java 8 bytecode, so that pin is now scoped to compileJava and
# 6.x resolves on every test classpath.
mockk             = "1.14.11"
junit             = "6.1.3"

[libraries]
jsvg = { module = "com.github.weisj:jsvg", version.ref = "jsvg" }
# Logging
slf4j-api                       = { group = "org.slf4j",       name = "slf4j-api",                version.ref = "slf4j" }
slf4j-simple                    = { group = "org.slf4j",       name = "slf4j-simple",             version.ref = "slf4j" }
logback-classic                 = { group = "ch.qos.logback",  name = "logback-classic",          version.ref = "logback" }

# Ktor
ktor-client-core                = { group = "io.ktor", name = "ktor-client-core",                 version.ref = "ktor" }
ktor-client-okhttp              = { group = "io.ktor", name = "ktor-client-okhttp",               version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation",  version.ref = "ktor" }
ktor-serialization-json         = { group = "io.ktor", name = "ktor-serialization-kotlinx-json",  version.ref = "ktor" }
ktor-client-mock                = { group = "io.ktor", name = "ktor-client-mock",                 version.ref = "ktor" }
# Self-signed certificates for the TLS-scoping test. Test scope only.
okhttp-tls                      = { group = "com.squareup.okhttp3", name = "okhttp-tls",          version.ref = "okhttp" }

# Ktor server (puppet HTTP control surface in client-ui — see hivens.ui.puppet)
ktor-server-core                = { group = "io.ktor", name = "ktor-server-core",                 version.ref = "ktor" }
ktor-server-cio                 = { group = "io.ktor", name = "ktor-server-cio",                  version.ref = "ktor" }
ktor-server-content-negotiation = { group = "io.ktor", name = "ktor-server-content-negotiation",  version.ref = "ktor" }

# Kotlinx
kotlinx-serialization-json      = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-core         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-core",    version.ref = "coroutines" }
kotlinx-coroutines-test         = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test",    version.ref = "coroutines" }
kotlinx-coroutines-swing        = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-swing",   version.ref = "coroutines" }
kotlinx-coroutines-slf4j        = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-slf4j",   version.ref = "coroutines" }

# DI
koin-core                       = { group = "io.insert-koin", name = "koin-core",    version.ref = "koin" }
koin-compose                    = { group = "io.insert-koin", name = "koin-compose", version.ref = "koin" }

# Compose (explicit refs in addition to plugin DSL accessors)
compose-runtime                 = { group = "org.jetbrains.compose.runtime",    name = "runtime",             version.ref = "compose" }
compose-foundation              = { group = "org.jetbrains.compose.foundation", name = "foundation",          version.ref = "compose" }
compose-material3               = { group = "org.jetbrains.compose.material3",  name = "material3",           version.ref = "composeMaterial3" }
compose-ui                      = { group = "org.jetbrains.compose.ui",         name = "ui",                  version.ref = "compose" }
compose-components-resources    = { group = "org.jetbrains.compose.components", name = "components-resources", version.ref = "compose" }

# UI add-ons
androidx-graphics-shapes        = { group = "androidx.graphics", name = "graphics-shapes",        version.ref = "graphicsShapes" }
multiplatform-markdown-m3       = { group = "com.mikepenz",        name = "multiplatform-markdown-renderer-m3", version.ref = "markdownRenderer" }
markdown-core                   = { group = "org.jetbrains",       name = "markdown",            version.ref = "markdown" }
jsoup                           = { group = "org.jsoup",           name = "jsoup",               version.ref = "jsoup" }
material-color-utilities        = { group = "com.materialkolor",   name = "material-color-utilities", version.ref = "materialColorUtils" }
filekit-core                    = { group = "io.github.vinceglb", name = "filekit-core",         version.ref = "filekit" }
filekit-dialogs-compose         = { group = "io.github.vinceglb", name = "filekit-dialogs-compose", version.ref = "filekit" }

# Misc
commons-compress                = { group = "org.apache.commons", name = "commons-compress", version.ref = "commonsCompress" }
jbsdiff                          = { group = "io.sigpipe", name = "jbsdiff", version.ref = "jbsdiff" }
xodus-environment               = { group = "org.jetbrains.xodus", name = "xodus-environment", version.ref = "xodus" }
libtray                         = { group = "dev.hivens", name = "libtray", version.ref = "libtray" }
libnotify                       = { group = "dev.hivens", name = "libnotify", version.ref = "libnotify" }
libvault                        = { group = "dev.hivens", name = "libvault", version.ref = "libvault" }
# skinema-compose pulls -core and -skiko at runtime; -skiko (the Skia frame
# bridge, VideoFrameImage) is also a compile dep -- the background renders
# frames through its own Painter rather than VideoSurface. Natives are
# per-platform runtimeOnly classifiers, declared directly in client-ui.
skinema-compose                 = { group = "dev.hivens", name = "skinema-compose", version.ref = "skinema" }
skinema-skiko                   = { group = "dev.hivens", name = "skinema-skiko",   version.ref = "skinema" }

# JNA dropped — was only present for dorkbox/SystemTray. libtray is
# pure java.lang.foreign (Project Panama) and pulls no JNA transitively.

# Test
mockk                           = { group = "io.mockk", name = "mockk", version.ref = "mockk" }
junit-bom                       = { group = "org.junit",          name = "junit-bom",               version.ref = "junit" }
junit-jupiter                   = { group = "org.junit.jupiter",  name = "junit-jupiter",           version.ref = "junit" }
junit-platform-launcher         = { group = "org.junit.platform", name = "junit-platform-launcher", version.ref = "junit" }

# KSP processor API (used by :widget-processor to scan @Widget composables
# and emit GeneratedWidgetRegistry at compile time).
ksp-api                         = { group = "com.google.devtools.ksp", name = "symbol-processing-api", version.ref = "ksp" }

[plugins]
kotlin-jvm                      = { id = "org.jetbrains.kotlin.jvm",                  version.ref = "kotlin" }
kotlin-multiplatform            = { id = "org.jetbrains.kotlin.multiplatform",        version.ref = "kotlin" }
kotlin-serialization            = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
kotlin-compose-compiler         = { id = "org.jetbrains.kotlin.plugin.compose",       version.ref = "kotlin" }
compose                         = { id = "org.jetbrains.compose",                     version.ref = "compose" }
buildconfig                     = { id = "com.github.gmazzo.buildconfig",             version.ref = "buildconfigPlugin" }
versions                        = { id = "io.github.ben-manes.versions",              version.ref = "versionsPlugin" }
ksp                             = { id = "com.google.devtools.ksp",                   version.ref = "ksp" }
