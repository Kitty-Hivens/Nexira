# ============================================================================
# Library / plugin versions live in gradle/libs.versions.toml.
# This file holds Gradle-runtime configuration only.
# ============================================================================

# Local builds resolve the version via `git describe --tags --always --dirty`
# (see root build.gradle.kts:12). CI overrides on tagged releases with
# -PappVersion=<tag>. Don't pin a literal here -- it silently overrides git
# describe and ships falsely-tagged binaries (this file had appVersion=2.2.12
# pinned through 2.2.13/2.2.14 cycles before the line was removed).

# ============================================================================
# GRADLE PERFORMANCE OPTIMIZATION
# ============================================================================

# Memory allocation (increased for faster builds)
org.gradle.jvmargs=-Xmx6g -Xms2g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseStringDeduplication

# Parallel execution
org.gradle.parallel=true
org.gradle.workers.max=8

# Caching
org.gradle.caching=true
org.gradle.configuration-cache=true
# Promoted from `warn` to `fail` 2026-05-17. Validated with
# `./gradlew help --configuration-cache --warning-mode=all` and a multi-module
# compileKotlin run -- both produce zero config-cache problems with the
# current build scripts. `fail` makes any future regression a hard error
# instead of a buried warning in CI logs that nobody reads.
org.gradle.configuration-cache.problems=fail

# Daemon optimization
org.gradle.daemon=true
org.gradle.daemon.idletimeout=7200000

# Build optimization
org.gradle.vfs.watch=true
org.gradle.vfs.verbose=false

# Kotlin compiler
kotlin.incremental=true
kotlin.build.report.output=file

# Compose optimization
compose.desktop.verbose=false

# ============================================================================
# KOTLIN COMPILER DAEMON
# ============================================================================
kotlin.daemon.jvmargs=-Xmx4g -Xms1g -XX:+UseParallelGC -XX:ReservedCodeCacheSize=512m -Dkotlin.daemon.client.alive.path.checking.enabled=false

# ============================================================================
# BUILD FEATURES
# ============================================================================
# Shrinker == ProGuard 7.8.2 (com.guardsquare:proguard-gradle, pinned in
# libs.versions.toml). Config lives in client-ui/compose-desktop.pro and is
# wired through buildTypes.release.proguard { ... } in client-ui/build.gradle.kts.
#
# The `compose.desktop.r8.enabled=true` flag used to live here -- it was a
# dead knob. Compose Multiplatform 1.11.0-alpha04 doesn't honour it: the
# release build still spawns `proguard.ProGuard` (verified via the
# `:client-ui:proguardReleaseJars` task banner in the build log, 2026-05-16).
# Don't re-add it without first confirming R8 actually runs against our deps
# -- Compose-MP's R8 path doesn't ship the JDK 25 / Panama keep rules our
# config relies on.
#
# `android.useAndroidX` / `android.enableJetifier` are inherited noise from
# the Compose-MP project template -- this is JVM-only, no AGP loaded.
