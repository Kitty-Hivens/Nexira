# ============================================================================
# Library / plugin versions live in gradle/libs.versions.toml.
# This file holds Gradle-runtime configuration only.
# ============================================================================

# Local builds resolve the version via `git describe --tags --always --dirty`
# (see root build.gradle.kts:12). CI overrides on tagged releases with
# -PappVersion=<tag>. Don't pin a literal here -- it silently overrides git
# describe and ships falsely-tagged binaries (this file had appVersion=2.2.12
# pinned through 2.2.13/2.2.14 cycles before the line was removed).

# ============================================================================
# GRADLE PERFORMANCE OPTIMIZATION
# ============================================================================

# Memory allocation (increased for faster builds)
org.gradle.jvmargs=-Xmx6g -Xms512m -XX:+UseG1GC -XX:G1PeriodicGCInterval=60000 -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseStringDeduplication

# A daemon spends most of its life idle between short bursts of work, so both
# JVMs above run G1 with a periodic collection: an idle daemon collects once a
# minute and uncommits, instead of holding its high-water mark until it exits.
# ParallelGC was the wrong fit for that lifecycle -- highest throughput, and it
# effectively never returns a page to the OS, so a compile daemon that peaked at
# four gigabytes kept them for as long as it lived. The test JVMs keep
# ParallelGC on purpose (see the root build script): those live for seconds.
#
# Note that everything in this block is overridden by
# GRADLE_USER_HOME/gradle.properties where one exists, which takes precedence
# over the project file. On a machine with local overrides these values do not
# apply at all.

# Parallel execution
org.gradle.parallel=true
org.gradle.workers.max=8

# Caching
org.gradle.caching=true
org.gradle.configuration-cache=true
# Promoted from `warn` to `fail` 2026-05-17. Validated with
# `./gradlew help --configuration-cache --warning-mode=all` and a multi-module
# compileKotlin run -- both produce zero config-cache problems with the
# current build scripts. `fail` makes any future regression a hard error
# instead of a buried warning in CI logs that nobody reads.
org.gradle.configuration-cache.problems=fail

# Daemon optimization
org.gradle.daemon=true
org.gradle.daemon.idletimeout=7200000

# Build optimization
org.gradle.vfs.watch=true
org.gradle.vfs.verbose=false

# Kotlin compiler
kotlin.incremental=true
kotlin.build.report.output=file

# Compose optimization
compose.desktop.verbose=false

# ============================================================================
# KOTLIN COMPILER DAEMON
# ============================================================================
kotlin.daemon.jvmargs=-Xmx4g -Xms512m -XX:+UseG1GC -XX:G1PeriodicGCInterval=60000 -XX:ReservedCodeCacheSize=512m -Dkotlin.daemon.client.alive.path.checking.enabled=false

# ============================================================================
# BUILD FEATURES
# ============================================================================
# Shrinker == ProGuard 7.8.2 (com.guardsquare:proguard-gradle, pinned in
# libs.versions.toml). Config lives in client-ui/compose-desktop.pro and is
# wired through buildTypes.release.proguard { ... } in client-ui/build.gradle.kts.
#
# The `compose.desktop.r8.enabled=true` flag used to live here -- it was a
# dead knob. Compose Multiplatform 1.11.0-alpha04 doesn't honour it: the
# release build still spawns `proguard.ProGuard` (verified via the
# `:client-ui:proguardReleaseJars` task banner in the build log, 2026-05-16).
# Don't re-add it without first confirming R8 actually runs against our deps
# -- Compose-MP's R8 path doesn't ship the JDK 25 / Panama keep rules our
# config relies on.

# AGP 9 gives unit tests to the tested build type alone, debug. The IDE's Compose Preview
# builds through the unit tests of whichever variant it previews, release included, and
# AGP refuses to create its task where that variant has none.
android.onlyEnableUnitTestForTheTestedBuildType=false

# Every multiplatform module wires its own shared JVM source set under the desktop and android ones,
# so Kotlin's default hierarchy template has nothing to add and warns about the explicit edges.
kotlin.mpp.applyDefaultHierarchyTemplate=false

# The widget API a module jar is built for, stamped into its manifest by every module build.
# Held equal to hivens.widget.api.WidgetApi.VERSION by a widget-api test, so the two move together.
nexira.widgetApi=4

# The packs module API a module jar is built against, as major.minor, stamped into its
# manifest under Nexira-Module-Requires by a module build that compiles against :packs-api.
# Held equal to hivens.packs.api.PacksApi.VERSION by a packs-api test.
nexira.packsApi=3.0

# The accounts module API a module jar is built against, as major.minor, stamped into its
# manifest under Nexira-Module-Requires by a module build that compiles against :accounts-api.
# Held equal to hivens.accounts.api.AccountsApi.VERSION by an accounts-api test.
nexira.accountsApi=1.0

# The catalogue module API a module jar is built against, as major.minor, stamped into its
# manifest under Nexira-Module-Requires by a module build that compiles against :catalogue-api.
# Held equal to hivens.catalogue.api.CatalogueApi.VERSION by a catalogue-api test.
nexira.catalogueApi=3.0

# The language module API a module jar is built against, as major.minor, stamped into its
# manifest under Nexira-Module-Requires by a module build that compiles against :i18n-api.
# Held equal to hivens.i18n.api.I18nApi.VERSION by an i18n-api test.
nexira.i18nApi=1.0

# The themes module API a module jar is built against, as major.minor, stamped into its
# manifest under Nexira-Module-Requires by a module build that compiles against :look:colour-nx-api.
# Held equal to hivens.themes.api.ThemesApi.VERSION by a colour-nx-api test.
nexira.themesApi=2.0

# The look manager API a module jar is built against, as major.minor, stamped into its manifest
# under Nexira-Module-Requires as nexira.look.manager by a module build that compiles against
# :look:manager-api. The nexira.look convention plugin reads it for that module, and a test holds
# it equal to hivens.look.manager.api.LookApi.VERSION.
nexira.lookManagerApi=1.1

# The colour axis API a module jar is built against, as major.minor, stamped into its manifest under
# Nexira-Module-Requires as nexira.look.colour by a module build that compiles against :look:colour-api.
# The nexira.look convention plugin reads it for that module, and a test holds it equal to
# hivens.look.colour.api.ColourApi.VERSION.
nexira.lookColourApi=1.0
nexira.lookMotionApi=1.0
nexira.lookShapeApi=1.0
nexira.lookStrokeApi=1.0
nexira.lookSurfaceApi=1.0
nexira.lookTimingApi=1.0
nexira.lookFeedbackApi=1.0
nexira.lookTypeApi=1.0
nexira.lookIconApi=2.0
nexira.lookCursorApi=1.0
