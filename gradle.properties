# Infrastructure
kotlinVersion=2.3.20-RC3
appVersion=2.0.8

# Core Dependencies
ktorVersion=3.4.1
koinVersion=4.2.0-RC2
koinComposeVersion=4.2.0-RC2
serializationVersion=1.10.0
coroutinesVersion=1.10.2

# Compose Framework
composeVersion=1.11.0-alpha04
iconsVersion=1.7.3
markdownRendererVersion=0.39.2
systemTray=4.4

# UI Libraries
coilVersion=3.4.0
coilNetworkVersion=3.4.0
filekitVersion=0.13.0

# Utilities & Logging
slf4jVersion=2.1.0-alpha1
logbackVersion=1.5.32
commonsCompressVersion=1.28.0
proguardVersion=7.8.2

# Testing
mockkVersion=1.13.12

# ============================================================================
# GRADLE PERFORMANCE OPTIMIZATION
# ============================================================================

# Memory allocation (increased for faster builds)
org.gradle.jvmargs=-Xmx6g -Xms2g -XX:+UseG1GC -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8 -XX:+UseStringDeduplication

# Parallel execution
org.gradle.parallel=true
org.gradle.workers.max=8

# Caching
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.configuration-cache.problems=warn

# Daemon optimization
org.gradle.daemon=true
org.gradle.daemon.idletimeout=7200000

# Build optimization
org.gradle.vfs.watch=true
org.gradle.vfs.verbose=false

# Kotlin compiler
kotlin.incremental=true
kotlin.build.report.output=file

# Compose optimization
compose.desktop.verbose=false

# ============================================================================
# KOTLIN COMPILER DAEMON
# ============================================================================
kotlin.daemon.jvmargs=-Xmx4g -Xms1g -XX:+UseParallelGC -XX:ReservedCodeCacheSize=512m -Dkotlin.daemon.client.alive.path.checking.enabled=false

# ============================================================================
# BUILD FEATURES
# ============================================================================
android.useAndroidX=false
android.enableJetifier=false
compose.desktop.r8.enabled=true
